# Smart Energy Automation Logic
# Verified entity IDs from live HA instance (2026-06-05):
#   sensor.nordpool_kwh_se3_sek_3_10_025  — Nord Pool SE3, 15-min intervals
#   sensor.greenely_daily_usage           — daily kWh, data[] attribute
#   sensor.greenely_prices                — Greenely price data
#   sensor.eve_room_voc / temperature / humidity — Eve Room (pending BT pairing)
#   sensor.saveeye_current_power          — pending SaveEye entity setup
#
# Prerequisites — create in HA (Settings > Devices > Helpers):
#   input_number.cheap_price_threshold   (SEK/kWh, e.g. 0.80)

automation:

# ─────────────────────────────────────────────────────────────────────────────
# 1. EVE ROOM AIR QUALITY ALERT
# ─────────────────────────────────────────────────────────────────────────────

  - id: eve_room_air_quality_alert
    alias: "Eve Room: Alert on poor air quality"
    description: >
      Notifies when Eve Room VOC exceeds 1100 ppb for 5 minutes.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.eve_room_voc
        above: 1100
        for: "00:05:00"
    action:
      - service: notify.mobile_app_casa
        data:
          title: "Air Quality Alert"
          message: >
            Eve Room VOC: {{ states('sensor.eve_room_voc') }} ppb.
            Open a window or ventilate.
            Temp: {{ states('sensor.eve_room_temperature') }}°C,
            Humidity: {{ states('sensor.eve_room_humidity') }}%.


# ─────────────────────────────────────────────────────────────────────────────
# 2. EXPENSIVE HOUR ALERT
# Notifies when Nord Pool price exceeds threshold — useful for timing
# large appliances (dishwasher, washing machine, EV charging when available).
# ─────────────────────────────────────────────────────────────────────────────

  - id: expensive_hour_alert
    alias: "Energy: Notify when price is high"
    description: >
      Sends a push notification when the current Nord Pool price exceeds
      the configured threshold.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.nordpool_kwh_se3_sek_3_10_025
        above: input_number.cheap_price_threshold
    action:
      - service: notify.mobile_app_casa
        data:
          title: "High Electricity Price"
          message: >
            Current price: {{ states('sensor.nordpool_kwh_se3_sek_3_10_025') }} SEK/kWh.
            Day average: {{ state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'average') | round(3) }} SEK/kWh.
            Avoid running high-load appliances now.

  - id: cheap_hour_alert
    alias: "Energy: Notify when price drops cheap"
    description: >
      Notifies when the price falls back below the threshold — good time
      to run dishwasher, washing machine, or charge devices.
    mode: single
    trigger:
      - platform: numeric_state
        entity_id: sensor.nordpool_kwh_se3_sek_3_10_025
        below: input_number.cheap_price_threshold
    action:
      - service: notify.mobile_app_casa
        data:
          title: "Cheap Electricity Now"
          message: >
            Price dropped to {{ states('sensor.nordpool_kwh_se3_sek_3_10_025') }} SEK/kWh.
            Good time to run appliances.


# ─────────────────────────────────────────────────────────────────────────────
# 3. DAILY MORNING BRIEFING (07:00)
# ─────────────────────────────────────────────────────────────────────────────

  - id: daily_energy_briefing
    alias: "Energy: Daily morning briefing at 07:00"
    description: >
      Push notification with today's Nord Pool stats and cheapest window.
    mode: single
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: notify.mobile_app_casa
        data:
          title: "Energy Plan for Today"
          message: >
            {% set cur = states('sensor.nordpool_kwh_se3_sek_3_10_025') | float(0) %}
            {% set avg = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'average') | float(0) %}
            {% set min_p = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'min') | float(0) %}
            {% set max_p = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'max') | float(0) %}
            {% set tomorrow = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'tomorrow_valid') %}
            Nord Pool SE3 today:
            Now {{ cur }} | Avg {{ avg | round(3) }} | Min {{ min_p }} | Max {{ max_p }} SEK/kWh.
            {% if tomorrow %}Tomorrow prices available — check the dashboard.{% endif %}
