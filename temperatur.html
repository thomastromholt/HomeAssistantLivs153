<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            border-top: 4px solid #5ac8fa;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
        }

        h1 { text-align: center; font-size: 18px; color: #333; margin-bottom: 8px; }

        .error { background: #ff3b30; color: white; padding: 8px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; }
        [hidden] { display: none !important; }

        .rooms {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
            gap: 8px;
        }

        .room {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }

        .room-name { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .value {
            display: block;
            width: 100%;
            padding: 2px 0;
            border: 0;
            border-radius: 6px;
            background: none;
            font-family: inherit;
            cursor: pointer;
        }
        .value:hover, .value:focus-visible { background: #e6eef2; outline: none; }
        .room-temp { font-size: 22px; font-weight: bold; color: #5ac8fa; }
        .room-humidity { font-size: 13px; color: #666; margin-top: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ Temperatur</h1>
        <div id="error" class="error" hidden></div>
        <div class="rooms" id="rooms"></div>
    </div>

    <script>
        const ROOMS = [
            { name: 'Soveværelse', temp: 'sensor.ewelink_snzb_02p_temperatur', humidity: 'sensor.ewelink_snzb_02p_luftfugtighed' },
            { name: 'Toilet', temp: 'sensor.toilet_temperatur', humidity: 'sensor.toilet_luftfugtighed' },
            { name: 'Stue', temp: 'sensor.stue_stuen_temp_temperatur', humidity: 'sensor.stue_stuen_temp_luftfugtighed' },
        ];

        // Inside the dashboard, go through Home Assistant's own connection: it refreshes the login token itself.
        // Opened standalone (e.g. headless tests), fall back to the token the frontend stores in localStorage.
        async function callApi(method, path, body) {
            let hass = null;
            try { hass = window.parent.document.querySelector('home-assistant')?.hass; } catch (e) { /* cross-origin */ }
            if (hass) return hass.callApi(method, path, body);

            const tokens = JSON.parse(localStorage.getItem('hassTokens') || 'null');
            if (!tokens) throw new Error('Not logged in to Home Assistant');
            const res = await fetch('/api/' + path, {
                method,
                headers: { Authorization: `Bearer ${tokens.access_token}`, 'Content-Type': 'application/json' },
                body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`), { status_code: res.status });
            return res.json();
        }

        async function reading(entityId) {
            try {
                const value = parseFloat((await callApi('GET', `states/${entityId}`)).state);
                return Number.isNaN(value) ? null : value;
            } catch (error) {
                if ((error.status_code ?? error.status) === 404) return null;
                throw error;
            }
        }

        // Opens Home Assistant's own history pop-up (graph + time picker); possible because
        // this card is served from the same origin as the HA frontend.
        function openHistory(entityId) {
            const ha = window.parent.document.querySelector('home-assistant');
            ha.dispatchEvent(new CustomEvent('hass-more-info', {
                detail: { entityId },
                bubbles: true,
                composed: true,
            }));
        }

        function valueButton(className, entityId) {
            const button = document.createElement('button');
            button.className = `value ${className}`;
            button.addEventListener('click', () => openHistory(entityId));
            return button;
        }

        const cells = ROOMS.map(room => {
            const card = document.createElement('div');
            card.className = 'room';
            const name = document.createElement('div');
            name.className = 'room-name';
            name.textContent = room.name;
            const temp = valueButton('room-temp', room.temp);
            const humidity = valueButton('room-humidity', room.humidity);
            card.append(name, temp, humidity);
            document.getElementById('rooms').append(card);
            return { temp, humidity };
        });

        async function render() {
            const errorBox = document.getElementById('error');
            try {
                const values = await Promise.all(ROOMS.map(async room => ({
                    temp: await reading(room.temp),
                    humidity: await reading(room.humidity),
                })));
                values.forEach((v, i) => {
                    cells[i].temp.textContent = v.temp === null ? '–' : `${v.temp.toFixed(1)} °C`;
                    cells[i].humidity.textContent = v.humidity === null ? '–' : `💧 ${v.humidity.toFixed(0)} %`;
                });
                errorBox.hidden = true;
            } catch (error) {
                errorBox.textContent = error.message || error.error || 'Request failed';
                errorBox.hidden = false;
            }
        }

        render();
        setInterval(render, 30e3);
    </script>
</body>
</html>
