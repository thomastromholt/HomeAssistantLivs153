title: Remote Control
views:
  - title: Energy & Climate
    path: energy_climate
    icon: mdi:lightning-bolt
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, 1fr)
      grid-template-rows: auto
      gap: 12px
    badges: []
    cards:

      # ─── ROW 1: Real-time power (SaveEye) ────────────────────────────────
      - type: custom:mini-graph-card
        name: Live Household Power
        icon: mdi:transmission-tower
        entities:
          - entity: sensor.saveeye_current_power
            name: Load (W)
        hours_to_show: 1
        points_per_hour: 60
        line_width: 2
        show:
          extrema: true
          labels: true
        style: |
          ha-card { font-size: 16px; }
        grid_options:
          columns: 2
          rows: 2

      - type: entities
        title: Energy Today (Greenely)
        show_header_toggle: false
        entities:
          - entity: sensor.greenely_current_price
            name: Current Price
            icon: mdi:tag
          - entity: sensor.greenely_today_cost
            name: Cost Today
            icon: mdi:currency-usd
          - entity: sensor.saveeye_energy_today
            name: Usage Today
            icon: mdi:counter
        grid_options:
          columns: 2
          rows: 2

      # ─── ROW 2: Nord Pool prices — today & tomorrow ───────────────────────
      - type: custom:apexcharts-card
        header:
          title: Nord Pool — Today
          show: true
        series:
          - entity: sensor.nordpool_kwh_se3_sek_3_10_0
            type: column
            name: SEK/kWh
            color: '#f5a623'
            data_generator: |
              const prices = entity.attributes.today || [];
              return prices.map((p, i) => [
                new Date().setHours(i, 0, 0, 0), p
              ]);
          - entity: sensor.nordpool_kwh_se3_sek_3_10_0
            type: line
            name: Avg
            color: '#e74c3c'
            data_generator: |
              const prices = entity.attributes.today || [];
              const avg = prices.reduce((a, b) => a + b, 0) / prices.length;
              return prices.map((_, i) => [
                new Date().setHours(i, 0, 0, 0), avg
              ]);
        graph_span: 24h
        span:
          start: day
        yaxis:
          - min: 0
        grid_options:
          columns: 2
          rows: 2

      - type: custom:apexcharts-card
        header:
          title: Nord Pool — Tomorrow
          show: true
        series:
          - entity: sensor.nordpool_kwh_se3_sek_3_10_0
            type: column
            name: SEK/kWh
            color: '#3498db'
            data_generator: |
              const prices = entity.attributes.tomorrow || [];
              if (!entity.attributes.tomorrow_valid || !prices.length) {
                return [[Date.now(), null]];
              }
              const tomorrow = new Date();
              tomorrow.setDate(tomorrow.getDate() + 1);
              return prices.map((p, i) => [
                new Date(tomorrow).setHours(i, 0, 0, 0), p
              ]);
        graph_span: 24h
        span:
          start: +1d
        yaxis:
          - min: 0
        grid_options:
          columns: 2
          rows: 2

      # ─── ROW 3: Greenely — monthly consumption & cost ────────────────────
      # sensor.greenely_month: state = total kWh, attributes: cost (SEK), daily_usages[]
      # Verify entity ID in Developer Tools → States after installing Greenely HACS

      - type: entities
        title: This Month (Greenely)
        show_header_toggle: false
        entities:
          - entity: sensor.greenely_month
            name: Consumption
            icon: mdi:lightning-bolt
          - type: attribute
            entity: sensor.greenely_month
            attribute: cost
            name: Cost (SEK)
            icon: mdi:cash
          - entity: sensor.greenely_today
            name: Today (kWh)
            icon: mdi:calendar-today
          - type: attribute
            entity: sensor.greenely_today
            attribute: cost
            name: Today Cost (SEK)
            icon: mdi:receipt
          - entity: sensor.greenely_current_price
            name: Current Price (SEK/kWh)
            icon: mdi:tag
        grid_options:
          columns: 2
          rows: 3

      - type: custom:apexcharts-card
        header:
          title: Daily Consumption This Month (kWh)
          show: true
        graph_span: 1month
        span:
          start: month
        series:
          - entity: sensor.greenely_month
            name: kWh
            type: column
            color: '#27ae60'
            data_generator: |
              const usages = entity.attributes.daily_usages || [];
              return usages.map(d => [
                new Date(d.date).getTime(),
                parseFloat(d.usage) || 0
              ]);
          - entity: sensor.greenely_month
            name: Cost (SEK)
            type: line
            color: '#e74c3c'
            yaxis_id: cost
            data_generator: |
              const usages = entity.attributes.daily_usages || [];
              return usages.map(d => [
                new Date(d.date).getTime(),
                parseFloat(d.cost) || 0
              ]);
        yaxis:
          - id: main
            min: 0
            apex_config:
              title:
                text: kWh
          - id: cost
            opposite: true
            min: 0
            apex_config:
              title:
                text: SEK
        apex_config:
          chart:
            type: bar
          plotOptions:
            bar:
              columnWidth: 70%
        grid_options:
          columns: 4
          rows: 3

      # ─── ROW 4: Eve Room Air Quality (Bluetooth) ─────────────────────────
      - type: vertical-stack
        title: Eve Room — Air Quality
        cards:
          - type: gauge
            entity: sensor.eve_room_voc
            name: VOC (Air Quality)
            unit: ppb
            min: 0
            max: 3000
            severity:
              green: 0
              yellow: 800
              red: 1500
          - type: entities
            entities:
              - entity: sensor.eve_room_temperature
                name: Temperature
                icon: mdi:thermometer
              - entity: sensor.eve_room_humidity
                name: Humidity
                icon: mdi:water-percent
        grid_options:
          columns: 2
          rows: 3

      # ─── ROW 5: Zigbee climate sensors ───────────────────────────────────
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:thermometer
            content: "Living {{ states('sensor.temp_living_room') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Bedroom {{ states('sensor.temp_bedroom') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Kitchen {{ states('sensor.temp_kitchen') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Bathroom {{ states('sensor.temp_bathroom') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Office {{ states('sensor.temp_office') }}°"
        grid_options:
          columns: 4
          rows: 1

      - type: custom:mini-graph-card
        name: Temperature Trend (6h)
        entities:
          - entity: sensor.temp_living_room
            name: Living Room
          - entity: sensor.temp_bedroom
            name: Bedroom
          - entity: sensor.temp_kitchen
            name: Kitchen
          - entity: sensor.eve_room_temperature
            name: Eve Room
        hours_to_show: 6
        points_per_hour: 4
        smoothing: true
        grid_options:
          columns: 4
          rows: 2

      # ─── ROW 6: Humidity ──────────────────────────────────────────────────
      - type: entities
        title: Humidity
        show_header_toggle: false
        entities:
          - entity: sensor.humidity_living_room
            name: Living Room
          - entity: sensor.humidity_bedroom
            name: Bedroom
          - entity: sensor.humidity_bathroom
            name: Bathroom
          - entity: sensor.humidity_basement
            name: Basement
          - entity: sensor.humidity_kitchen
            name: Kitchen
          - entity: sensor.eve_room_humidity
            name: Eve Room
        grid_options:
          columns: 2
          rows: 3

