title: Huset
views:
  - title: Energy & Climate
    path: energy_climate
    icon: mdi:lightning-bolt
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, 1fr)
      grid-template-rows: auto
      gap: 12px
    badges: []
    cards:
      # ─── COLUMN 1: Energy & Pricing ────────────────────────────────────
      - type: markdown
        content: |
          # ⚡ Energy & Pricing

      - type: custom:apexcharts-card
        header:
          title: Nord Pool — Today (SE3)
          show: true
        series:
          - entity: sensor.nordpool_kwh_se3_sek_3_10_025
            type: column
            name: SEK/kWh
            color: '#27ae60'
            data_generator: |
              const data = entity.attributes.raw_today || [];
              return data.map(d => [new Date(d.start).getTime(), d.value]);
        graph_span: 24h
        span:
          start: day
        yaxis:
          - min: 0

      # ─── COLUMN 3: Temperature ────────────────────────────────────────
      - type: markdown
        content: |
          # 🌡️ Climate & Comfort

      # ─── COLUMN 4: Humidity & Sensors ─────────────────────────────────
      - type: entities
        title: Sensors
        show_header_toggle: false
        entities:
          - entity: input_boolean.sensor_overview
            name: Show Details

      # ─── ROW 2 ────────────────────────────────────────────────────────
      # COLUMN 1: Cost
      - type: markdown
        title: Estimated Daily Cost
        content: |
          **Yesterday usage × Day avg price:**

          Usage: {{ states("sensor.greenely_daily_usage_2") }} kWh

          Avg price: {{ state_attr("sensor.nordpool_kwh_se3_sek_3_10_025", "average") | round(2) }} SEK/kWh

          **Est. Cost: {{ (states("sensor.greenely_daily_usage_2") | float(0) * state_attr("sensor.nordpool_kwh_se3_sek_3_10_025", "average") | float(0)) | round(2) }} SEK**

      # ─── COLUMN 2: Hourly Consumption
      - type: conditional
        conditions:
          - entity: input_boolean.input_boolean_consumption_24h
            state: 'on'
        card:
          type: custom:apexcharts-card
          header:
            title: Hourly Consumption (24h)
            show: true
          series:
            - entity: sensor.greenely_hourly_usage
              name: kWh
              type: column
              color: '#f39c12'
              data_generator: |
                const data = entity.attributes.data || [];
                return data.map(d => [new Date(d.localtime).getTime(), parseFloat(d.usage) || 0]);
          graph_span: 24h
          yaxis:
            - min: 0

      # ─── COLUMN 3: Temperature
      - type: custom:apexcharts-card
        header:
          title: Temperature & Humidity (24h)
          show: true
        series:
          - entity: sensor.basement_temperature
            name: Bedroom Temp
            color: '#e74c3c'
            type: line
            stroke_width: 2
          - entity: sensor.ewelink_snzb_02p_temperature
            name: Living Room Temp
            color: '#3498db'
            type: line
            stroke_width: 2
          - entity: sensor.ewelink_snzb_02p_temperature_2
            name: Basement Temp
            color: '#27ae60'
            type: line
            stroke_width: 2
        graph_span: 24h
        yaxis:
          - min: 15
            max: 30

      # ─── COLUMN 4: Humidity
      - type: custom:apexcharts-card
        header:
          title: Humidity (24h)
          show: true
        series:
          - entity: sensor.basement_humidity
            name: Bedroom
            color: '#e74c3c'
            type: line
            stroke_width: 2
          - entity: sensor.ewelink_snzb_02p_humidity
            name: Living Room
            color: '#3498db'
            type: line
            stroke_width: 2
          - entity: sensor.ewelink_snzb_02p_humidity_2
            name: Basement
            color: '#27ae60'
            type: line
            stroke_width: 2
        graph_span: 24h
        yaxis:
          - min: 45
            max: 60

      # ─── ROW 3 ────────────────────────────────────────────────────────
      # COLUMN 1: View Toggle
      - type: entities
        title: View
        show_header_toggle: false
        entities:
          - entity: input_boolean.input_boolean_consumption_24h
            name: 24h / 1 Month

      # ─── COLUMN 2: Daily Consumption
      - type: conditional
        conditions:
          - entity: input_boolean.input_boolean_consumption_24h
            state: 'off'
        card:
          type: custom:apexcharts-card
          header:
            title: Daily Consumption (This Month)
            show: true
          series:
            - entity: sensor.greenely_daily_usage_2
              name: kWh
              type: column
              color: '#3498db'
              data_generator: |
                const data = entity.attributes.data || [];
                return data.map(d => [new Date(d.localtime).getTime(), parseFloat(d.usage) || 0]);
          yaxis:
            - min: 0

      # ─── COLUMN 3+4: Conditional Sensor Details
      - type: conditional
        conditions:
          - entity: input_boolean.sensor_overview
            state: 'on'
        card:
          type: entities
          title: Current Values
          show_header_toggle: false
          entities:
            - entity: sensor.basement_temperature
              name: Bedroom Temp (°C)
            - entity: sensor.basement_humidity
              name: Bedroom Humidity (%)
            - entity: sensor.ewelink_snzb_02p_temperature
              name: Living Temp (°C)
            - entity: sensor.ewelink_snzb_02p_humidity
              name: Living Humidity (%)
            - entity: sensor.ewelink_snzb_02p_temperature_2
              name: Basement Temp (°C)
            - entity: sensor.ewelink_snzb_02p_humidity_2
              name: Basement Humidity (%)
