title: Remote Control
views:
  - title: Energy & Climate
    path: energy_climate
    icon: mdi:lightning-bolt
    type: custom:grid-layout
    layout:
      grid-template-columns: repeat(4, 1fr)
      grid-template-rows: auto
      gap: 12px
    badges: []
    cards:

      # ─── ROW 1: Current price + daily stats ──────────────────────────────
      # Nord Pool live: sensor.nordpool_kwh_se3_sek_3_10_025
      # Greenely daily: sensor.greenely_daily_usage (data attribute = array of {localtime, usage})

      - type: entities
        title: Electricity Now
        show_header_toggle: false
        entities:
          - entity: sensor.nordpool_kwh_se3_sek_3_10_025
            name: Current Price (SEK/kWh)
            icon: mdi:flash
          - type: attribute
            entity: sensor.nordpool_kwh_se3_sek_3_10_025
            attribute: average
            name: Day Avg (SEK/kWh)
            icon: mdi:chart-line
          - type: attribute
            entity: sensor.nordpool_kwh_se3_sek_3_10_025
            attribute: min
            name: Day Min (SEK/kWh)
            icon: mdi:arrow-down
          - type: attribute
            entity: sensor.nordpool_kwh_se3_sek_3_10_025
            attribute: max
            name: Day Max (SEK/kWh)
            icon: mdi:arrow-up
        grid_options:
          columns: 2
          rows: 2

      - type: entities
        title: Greenely Usage
        show_header_toggle: false
        entities:
          - entity: sensor.greenely_daily_usage
            name: Yesterday (kWh)
            icon: mdi:counter
          - entity: sensor.greenely_prices
            name: Greenely Price
            icon: mdi:currency-usd
        grid_options:
          columns: 2
          rows: 2

      # ─── ROW 2: Nord Pool prices — today & tomorrow ───────────────────────
      # raw_today has 96 x 15-min intervals: [{start, end, value}]

      - type: custom:apexcharts-card
        header:
          title: Nord Pool — Today (SE3)
          show: true
        series:
          - entity: sensor.nordpool_kwh_se3_sek_3_10_025
            type: column
            name: SEK/kWh
            color: '#f5a623'
            data_generator: |
              const data = entity.attributes.raw_today || [];
              return data.map(d => [new Date(d.start).getTime(), d.value]);
          - entity: sensor.nordpool_kwh_se3_sek_3_10_025
            type: line
            name: Avg
            color: '#e74c3c'
            data_generator: |
              const data = entity.attributes.raw_today || [];
              const avg = entity.attributes.average || 0;
              return data.map(d => [new Date(d.start).getTime(), avg]);
        graph_span: 24h
        span:
          start: day
        yaxis:
          - min: 0
        grid_options:
          columns: 2
          rows: 2

      - type: custom:apexcharts-card
        header:
          title: Nord Pool — Tomorrow
          show: true
        series:
          - entity: sensor.nordpool_kwh_se3_sek_3_10_025
            type: column
            name: SEK/kWh
            color: '#3498db'
            data_generator: |
              const data = entity.attributes.raw_tomorrow || [];
              if (!entity.attributes.tomorrow_valid || !data.length) {
                return [[Date.now(), null]];
              }
              return data.map(d => [new Date(d.start).getTime(), d.value]);
        graph_span: 24h
        span:
          start: +1d
        yaxis:
          - min: 0
        grid_options:
          columns: 2
          rows: 2

      # ─── ROW 3: Greenely daily consumption chart ─────────────────────────
      # sensor.greenely_daily_usage.attributes.data = [{localtime: "Jun 01 2026", usage: "12.5"}]

      - type: entities
        title: Daily Usage (Greenely)
        show_header_toggle: false
        entities:
          - entity: sensor.greenely_daily_usage
            name: Yesterday
            icon: mdi:calendar-today
        grid_options:
          columns: 2
          rows: 2

      - type: custom:apexcharts-card
        header:
          title: Daily Consumption — Last 10 Days (kWh)
          show: true
        series:
          - entity: sensor.greenely_daily_usage
            name: kWh
            type: column
            color: '#27ae60'
            data_generator: |
              const data = entity.attributes.data || [];
              return data.map(d => [
                new Date(d.localtime).getTime(),
                parseFloat(d.usage) || 0
              ]);
        yaxis:
          - min: 0
        graph_span: 10d
        span:
          end: now
        grid_options:
          columns: 4
          rows: 3

      # ─── ROW 4: Eve Room Air Quality (Bluetooth — not yet paired) ────────
      - type: vertical-stack
        title: Eve Room — Air Quality
        cards:
          - type: gauge
            entity: sensor.eve_room_voc
            name: VOC (Air Quality)
            unit: ppb
            min: 0
            max: 3000
            severity:
              green: 0
              yellow: 800
              red: 1500
          - type: entities
            entities:
              - entity: sensor.eve_room_temperature
                name: Temperature
                icon: mdi:thermometer
              - entity: sensor.eve_room_humidity
                name: Humidity
                icon: mdi:water-percent
        grid_options:
          columns: 2
          rows: 3

      # ─── ROW 5: Zigbee climate sensors (not yet paired) ──────────────────
      - type: custom:mushroom-chips-card
        chips:
          - type: template
            icon: mdi:thermometer
            content: "Living {{ states('sensor.temp_living_room') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Bedroom {{ states('sensor.temp_bedroom') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Kitchen {{ states('sensor.temp_kitchen') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Bathroom {{ states('sensor.temp_bathroom') }}°"
          - type: template
            icon: mdi:thermometer
            content: "Office {{ states('sensor.temp_office') }}°"
        grid_options:
          columns: 4
          rows: 1

      - type: custom:mini-graph-card
        name: Temperature Trend (6h)
        entities:
          - entity: sensor.temp_living_room
            name: Living Room
          - entity: sensor.temp_bedroom
            name: Bedroom
          - entity: sensor.eve_room_temperature
            name: Eve Room
        hours_to_show: 6
        points_per_hour: 4
        smoothing: true
        grid_options:
          columns: 4
          rows: 2

      # ─── ROW 6: Humidity ──────────────────────────────────────────────────
      - type: entities
        title: Humidity
        show_header_toggle: false
        entities:
          - entity: sensor.humidity_living_room
            name: Living Room
          - entity: sensor.humidity_bedroom
            name: Bedroom
          - entity: sensor.humidity_bathroom
            name: Bathroom
          - entity: sensor.humidity_kitchen
            name: Kitchen
          - entity: sensor.eve_room_humidity
            name: Eve Room
        grid_options:
          columns: 2
          rows: 3
