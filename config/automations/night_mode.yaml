# Night mode for the radiator thermostats: lower the target by input_number.night_setback between 23:00 and 06:30.
# Per room: input_boolean.night_mode_<room> (on/off), input_boolean.night_active_<room> (set while lowered),
# input_number.day_target_<room> (the target to go back to).
# A target changed by hand during the night wins: the morning step only restores a target the automation set itself.
# Rooms so far: Stue and Køkken. Not Soveværelse (warmer at night: 20 °C when sleeping, 18 °C otherwise) and not Astrid. To add a room: create the three helpers, copy both automations and swap the names.
- id: night_mode_stue_start
  alias: Night mode Stue, start 23:00
  triggers:
    - trigger: time
      at: "23:00:00"
  conditions:
    - condition: state
      entity_id: input_boolean.night_mode_stue
      state: "on"
    - condition: state
      entity_id: climate.liljebagge_radiator_thermostat
      state: heat
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.day_target_stue
      data:
        value: "{{ state_attr('climate.liljebagge_radiator_thermostat', 'temperature') }}"
    - action: climate.set_temperature
      target:
        entity_id: climate.liljebagge_radiator_thermostat
      data:
        temperature: >-
          {{ [state_attr('climate.liljebagge_radiator_thermostat', 'temperature') | float
              - states('input_number.night_setback') | float, 5] | max }}
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.night_active_stue

- id: night_mode_stue_end
  alias: Night mode Stue, end 06:30
  triggers:
    - trigger: time
      at: "06:30:00"
  conditions:
    - condition: state
      entity_id: input_boolean.night_active_stue
      state: "on"
  actions:
    - if:
        - condition: template
          value_template: >-
            {{ (state_attr('climate.liljebagge_radiator_thermostat', 'temperature') | float(0)
                - ([states('input_number.day_target_stue') | float - states('input_number.night_setback') | float, 5] | max)) | abs < 0.1 }}
      then:
        - action: climate.set_temperature
          target:
            entity_id: climate.liljebagge_radiator_thermostat
          data:
            temperature: "{{ states('input_number.day_target_stue') | float }}"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.night_active_stue

