
# Stue and Køkken on weekdays: 20 °C in the morning (07-08) and from 16:00 (told at 15:00, a one hour lead for the cast iron),
# 18 °C from 08:00 to 15:00 while the family is away. Weekends: 20 °C all day, no change from this automation.
# Night mode (night_mode.yaml) still lowers both rooms by 2 °C from 23:00 to 06:30 every night.
# Switch it off with input_boolean.weekday_away_plan. A change made by hand stays until the next switch.
- id: living_weekday_plan
  alias: Stue og Køkken, hverdage væk 08:00 og 15:00
  mode: single
  triggers:
    - trigger: time
      at: "08:00:00"
    - trigger: time
      at: "15:00:00"
  conditions:
    - condition: time
      weekday: [mon, tue, wed, thu, fri]
    - condition: state
      entity_id: input_boolean.weekday_away_plan
      state: "on"
  actions:
    - variables:
        target: "{{ 18 if now().hour < 15 else 20 }}"
    - repeat:
        for_each:
          - climate.liljebagge_radiator_thermostat
          - climate.liljebagge_radiator_thermostat_2
        sequence:
          - action: climate.set_temperature
            continue_on_error: true
            target:
              entity_id: "{{ repeat.item }}"
            data:
              temperature: "{{ target }}"
