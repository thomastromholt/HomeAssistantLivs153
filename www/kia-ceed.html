<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kia Ceed</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .hero { text-align: center; }
        .soc { font-size: 58px; font-weight: 300; line-height: 1; color: #ffb340; transition: color 0.4s; }
        .soc .unit { margin-left: 2px; font-size: 22px; font-weight: 400; }
        .soc-bar { width: 62%; height: 4px; margin: 8px auto 8px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
        .soc-fill { height: 100%; width: 0; border-radius: 2px; background: #ffb340; transition: width 0.5s, background 0.4s; }
        .ranges { font-size: 15px; color: #e5ecf0; }
        .ranges .sep { margin: 0 4px; color: #6d808c; }

        .car { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .car { cursor: pointer; }
        .car img {
            max-width: 52%;
            max-height: 70%;
            object-fit: contain;
            -webkit-mask-image: radial-gradient(ellipse 52% 52% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 52% 52% at 50% 50%, #000 62%, transparent 100%);
        }
        .glow {
            position: absolute;
            left: 20%; right: 20%; bottom: 6%;
            height: 14px;
            border-radius: 50%;
            background: rgba(52, 199, 89, 0.55);
            filter: blur(10px);
            opacity: 0;
        }
        .glow.on { opacity: 1; animation: breathe 2s ease-in-out infinite; }
        @keyframes breathe { 50% { opacity: 0.35; } }

        /* Charger tiles, the same look as the other cards. */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid .tile-value.status { font-size: 16px; font-weight: 500; }
        .grid .tile-value.warn { color: #ffb340; }
        .grid .tile-value.bad { color: #ff6b61; }
        .grid .tile { display: flex; flex-direction: column; justify-content: center; }
        .grid .tile-label { font-size: 12px; }
        .grid .tile-value { margin-top: 6px; font-size: 24px; font-weight: 400; }
        .grid .tile-value small { font-size: 13px; }
        .grid .tile-value.live { color: #5fe085; }
        .grid .buttons { display: flex; flex-direction: column; gap: 4px; }
        .grid .btn-small { padding: 6px 10px; border: 0; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
        .grid .btn-go { background: rgba(95, 224, 133, 0.22); color: #5fe085; }
        .grid .btn-go:hover { background: rgba(95, 224, 133, 0.35); }
        .grid .btn-stop { background: rgba(255, 255, 255, 0.08); color: #c5d1d9; }
        .grid .btn-stop:hover { background: rgba(255, 255, 255, 0.12); }
    </style>
</head>
<body>
    <div class="container">
        <div class="head">
            <span class="name">Ceed <span class="muted">PHEV</span></span>
            <span class="pill" id="online"></span>
        </div>
        <div id="error" class="error" hidden></div>
        <div id="problems" class="problems" hidden></div>

        <div class="hero">
            <div class="soc"><span id="soc">–</span><span class="unit">%</span></div>
            <div class="soc-bar"><div class="soc-fill" id="socFill"></div></div>
            <div class="ranges"><span id="totalRange">–</span> km<span class="sep">/</span><span id="odometer">–</span> km</div>
        </div>

        <div class="car">
            <img src="/local/kia-car.png?v=1" alt="Kia Ceed SW PHEV">
            <div class="glow" id="glow"></div>
        </div>

        <div class="grid" id="tiles"></div>
        <div class="footer" id="updated"></div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        const E = {
            battery: 'sensor.ceed_ev_battery_level',
            totalRange: 'sensor.ceed_total_driving_range',
            odometer: 'sensor.ceed_odometer',
            charging: 'binary_sensor.ceed_ev_battery_charge',
            plug: 'binary_sensor.ceed_ev_battery_plug',
            chargeMinutes: 'sensor.ceed_estimated_charge_duration',
            updatedAt: 'sensor.ceed_last_updated_at',
            // Zaptec Go2 (the home charger).
            mode: 'sensor.go2_charger_mode',
            power: 'sensor.go2_charge_power',
            online: 'binary_sensor.go2_online',
        };

        // The car and the charging power both open the car pop-up (battery, charging and history); the charge time opens the car's charging sensor.
        const openCar = () => openPopup('/local/car.html?v=' + Date.now());
        document.querySelector('.car').addEventListener('click', openCar);
        // The charger's own state (Zaptec), first in the row.
        const statusTile = createTile(document.getElementById('tiles'), 'Charger', E.mode);
        statusTile.classList.add('status');
        const powerButton = document.createElement('button');
        powerButton.className = 'tile';
        powerButton.innerHTML = '<div class="tile-label">Charging power</div><div class="tile-value"></div>';
        powerButton.addEventListener('click', openCar);
        document.getElementById('tiles').append(powerButton);

        // Charge time tile (createTile returns the .tile-value element)
        const timeValueEl = createTile(document.getElementById('tiles'), 'Charge time', E.charging);
        // Add buttons to the charge-time tile's parent
        const timeTile = timeValueEl.parentElement;
        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'buttons';
        buttonsDiv.innerHTML = '<button class="btn-small btn-go" id="ladNuBtn">Lad nu</button><button class="btn-small btn-stop" id="folgPlanBtn">Følg plan</button>';
        timeTile.append(buttonsDiv);

        const tiles = {
            power: powerButton.querySelector('.tile-value'),
            time: timeValueEl,
        };

        const hours = minutes => `${Math.floor(minutes / 60)} h ${String(minutes % 60).padStart(2, '0')} min`;
        const batteryColor = level => level > 50 ? '#34c759' : level > 20 ? '#ffd60a' : '#ffb340';

        async function render() {
            try {
                const states = await statesOf(Object.values(E));
                const s = key => states[E[key]];

                const level = parseFloat(s('battery'));
                const color = batteryColor(level);
                document.getElementById('soc').textContent = formatNumber(s('battery')) ?? '–';
                document.querySelector('.soc').style.color = color;
                const fill = document.getElementById('socFill');
                fill.style.width = `${Number.isNaN(level) ? 0 : level}%`;
                fill.style.background = color;

                document.getElementById('totalRange').textContent = formatNumber(s('totalRange')) ?? '–';
                document.getElementById('odometer').textContent = formatNumber(s('odometer')) ?? '–';

                const kw = (parseFloat(s('power')) || 0) / 1000;
                const charging = s('mode') === 'connected_charging';
                tiles.power.innerHTML = `${kw.toFixed(1)} <small>kW</small>`;
                tiles.power.classList.toggle('live', charging);
                document.getElementById('glow').classList.toggle('on', charging);

                // Plugged in = the Zaptec charger sees the car (its long-lived API), not the Kia cloud.
                const plugged = String(s('mode')).startsWith('connected');
                const minutes = parseFloat(s('chargeMinutes'));
                tiles.time.textContent = charging
                    ? (Number.isNaN(minutes) ? 'Charging' : hours(minutes))
                    : '–';   // plugged in or not is shown in the charger tile
                tiles.time.classList.toggle('live', charging);

                const online = document.getElementById('online');
                const isOnline = s('online') === 'on';
                online.textContent = isOnline ? 'Charger online' : 'Charger offline';
                online.className = `pill ${isOnline ? 'good' : 'fair'}`;

                // Zaptec's mode in words. "connected_finished" is also what a pause looks like, so it only counts as
                // fully charged when the car itself reports a full battery.
                const mode = s('mode');
                const [statusText, statusClass] = !isOnline || isMissing(mode) ? ['Error', 'bad']
                    : mode === 'connected_charging' ? ['Charging', 'live']
                    : mode === 'connected_finished' ? (level >= 99 ? ['Fully charged', ''] : ['Paused', 'warn'])
                    : mode === 'connected_requesting' ? ['Waiting to start', 'warn']
                    : mode === 'disconnected' ? ['Not plugged in', '']
                    : [mode, 'warn'];
                statusTile.textContent = statusText;
                statusTile.className = `tile-value status ${statusClass}`;

                const updated = new Date(s('updatedAt'));
                document.getElementById('updated').textContent = Number.isNaN(updated.getTime())
                    ? ''
                    : `Car data from ${updated.toLocaleString('sv-SE', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}`;

                const problems = [];
                const ageHours = (Date.now() - updated.getTime()) / 3600e3;
                if (isMissing(s('battery'))) problems.push('No data from the car (Kia cloud)');
                else if (ageHours > 24) problems.push(`Car data is ${Math.round(ageHours)} h old`);
                if (isMissing(s('mode'))) problems.push('No data from the charger (Zaptec cloud)');
                else if (!isOnline) problems.push('Charger is offline: the values may be old');
                showProblems(problems);
                showError(null);
            } catch (error) {
                showError(error);
            }
        }

        // Lad nu / Følg plan buttons
        const LAD_MAX_HOUSE_A = 10;
        async function houseAmps() {
            const p1 = await callApi('GET', 'states/sensor.p1_meter_power_phase_1');
            const car = await callApi('GET', 'states/sensor.go2_current_phase_1');
            const fresh = (Date.now() - new Date(p1.last_updated).getTime()) / 1000 < 30;
            if (!fresh) return null;
            return Math.max(0, parseFloat(p1.state) / 230 - parseFloat(car.state));
        }
        function setupButtonListeners() {
            const ladNuBtn = document.getElementById('ladNuBtn');
            const folgPlanBtn = document.getElementById('folgPlanBtn');
            if (!ladNuBtn || !folgPlanBtn) return; // buttons not yet in DOM

            ladNuBtn.onclick = async () => {
                try {
                    const house = await houseAmps();
                    if (house === null) {
                        alert('Ingen frisk P1-måling. Starter ikke.');
                        return;
                    }
                    if (house > LAD_MAX_HOUSE_A) {
                        alert(`Huset trækker ${house.toFixed(0)} A (max ${LAD_MAX_HOUSE_A} A). Starter ikke.`);
                        return;
                    }
                    await callApi('POST', 'services/input_boolean/turn_on', { entity_id: 'input_boolean.lad_nu' });
                    alert('Lad nu aktiveret. Laderen starter inden for et minut.');
                } catch (error) {
                    alert('Fejl: ' + error.message);
                }
            };
            folgPlanBtn.onclick = async () => {
                try {
                    await callApi('POST', 'services/input_boolean/turn_off', { entity_id: 'input_boolean.lad_nu' });
                    alert('Følger planen igen.');
                } catch (error) {
                    alert('Fejl: ' + error.message);
                }
            };
        }
        setupButtonListeners();

        render();
        setInterval(render, 15e3);
    </script>
</body>
</html>
