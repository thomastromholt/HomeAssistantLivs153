<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kia Ceed</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .hero { text-align: center; }
        .soc { font-size: 58px; font-weight: 300; line-height: 1; color: #ffb340; transition: color 0.4s; }
        .soc .unit { margin-left: 2px; font-size: 22px; font-weight: 400; }
        .soc-bar { width: 62%; height: 4px; margin: 8px auto 8px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
        .soc-fill { height: 100%; width: 0; border-radius: 2px; background: #ffb340; transition: width 0.5s, background 0.4s; }
        .ranges { font-size: 15px; color: #e5ecf0; }
        .ranges .sep { margin: 0 4px; color: #6d808c; }

        .car { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
        .car { cursor: pointer; }
        .car img {
            max-width: 52%;
            max-height: 70%;
            object-fit: contain;
            -webkit-mask-image: radial-gradient(ellipse 52% 52% at 50% 50%, #000 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 52% 52% at 50% 50%, #000 62%, transparent 100%);
        }
        .glow {
            position: absolute;
            left: 20%; right: 20%; bottom: 6%;
            height: 14px;
            border-radius: 50%;
            background: rgba(52, 199, 89, 0.55);
            filter: blur(10px);
            opacity: 0;
        }
        .glow.on { opacity: 1; animation: breathe 2s ease-in-out infinite; }
        @keyframes breathe { 50% { opacity: 0.35; } }

        /* Charger tiles, the same look as the other cards. */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid .tile-value.status { font-size: 16px; font-weight: 500; }
        .grid .tile-value.warn { color: #ffb340; }
        .grid .tile-value.bad { color: #ff6b61; }
        .grid .tile { display: flex; flex-direction: column; justify-content: center; }
        .grid .tile-label { font-size: 12px; }
        .grid .tile-value { margin-top: 6px; font-size: 24px; font-weight: 400; }
        .grid .tile-value small { font-size: 13px; }
        .grid .tile-value.live { color: #5fe085; }
        /* Lad nu / Følg plan: the active choice is lit. */
        .grid .buttons { display: flex; gap: 4px; margin-top: 6px; }
        .grid .btn-small { flex: 1; padding: 5px 0; border: 0; border-radius: 8px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; background: rgba(255, 255, 255, 0.08); color: #8da0ad; transition: opacity 0.2s, background 0.2s, color 0.2s; }
        .grid .btn-small:disabled { opacity: 0.5; cursor: not-allowed; }
        .grid .btn-small.busy { opacity: 1; background: rgba(255, 255, 255, 0.12); color: #e5ecf0; cursor: progress; }
        .spinner { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .grid .tile-hint { margin-top: 3px; font-size: 11px; color: #8da0ad; line-height: 1.25; }
        .grid .btn-go.on { background: rgba(95, 224, 133, 0.28); color: #5fe085; }
        .grid .btn-go.stop { background: rgba(255, 165, 0, 0.22); color: #ffa500; }
        .grid .btn-stop.on { background: rgba(100, 210, 255, 0.2); color: #64d2ff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="head">
            <span class="name">Ceed <span class="muted">PHEV</span></span>
            <span class="pill" id="online"></span>
        </div>
        <div id="error" class="error" hidden></div>
        <div id="problems" class="problems" hidden></div>

        <div class="hero">
            <div class="soc"><span id="soc">–</span><span class="unit">%</span></div>
            <div class="soc-bar"><div class="soc-fill" id="socFill"></div></div>
            <div class="ranges"><span id="totalRange">–</span> km<span class="sep">/</span><span id="odometer">–</span> km</div>
        </div>

        <div class="car">
            <img src="/local/kia-car.png?v=1" alt="Kia Ceed SW PHEV">
            <div class="glow" id="glow"></div>
        </div>

        <div class="grid" id="tiles"></div>
        <div class="footer" id="updated"></div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        const E = {
            battery: 'sensor.ceed_ev_battery_level',
            totalRange: 'sensor.ceed_total_driving_range',
            odometer: 'sensor.ceed_odometer',
            charging: 'binary_sensor.ceed_ev_battery_charge',
            plug: 'binary_sensor.ceed_ev_battery_plug',
            chargeMinutes: 'sensor.ceed_estimated_charge_duration',
            updatedAt: 'sensor.ceed_last_updated_at',
            // Zaptec Go2 (the home charger).
            mode: 'sensor.go2_charger_mode',
            power: 'sensor.go2_charge_power',
            online: 'binary_sensor.go2_online',
            ladNu: 'input_boolean.lad_nu',
            ladStop: 'input_boolean.lad_stop',
            window: 'input_boolean.ladevindue',
        };

        // The car and the charging power both open the car pop-up (battery, charging and history); the charge time opens the car's charging sensor.
        const openCar = () => openPopup('/local/car.html?v=' + Date.now());
        document.querySelector('.car').addEventListener('click', openCar);
        // The charger's own state (Zaptec), first in the row.
        const statusTile = createTile(document.getElementById('tiles'), 'Charger', E.mode);
        statusTile.classList.add('status');
        const statusHint = document.createElement('div');
        statusHint.className = 'tile-hint';
        statusTile.after(statusHint);
        const powerButton = document.createElement('button');
        powerButton.className = 'tile';
        powerButton.innerHTML = '<div class="tile-label">Charging power</div><div class="tile-value"></div>';
        powerButton.addEventListener('click', openCar);
        document.getElementById('tiles').append(powerButton);

        // Charge time with the Lad nu / Følg plan buttons. A plain div, not a tile button, so a click on a button
        // does not also open a pop-up.
        const timeTile = document.createElement('div');
        timeTile.className = 'tile';
        timeTile.innerHTML = '<div class="tile-label">Charge time</div><div class="tile-value"></div>'
            + '<div class="buttons"><button class="btn-small btn-go" id="ladNuBtn">Lad nu</button>'
            + '<button class="btn-small btn-stop" id="folgPlanBtn">Følg plan</button></div>';
        document.getElementById('tiles').append(timeTile);

        const tiles = {
            power: powerButton.querySelector('.tile-value'),
            time: timeTile.querySelector('.tile-value'),
        };

        const hours = minutes => `${Math.floor(minutes / 60)} h ${String(minutes % 60).padStart(2, '0')} min`;
        const batteryColor = level => level > 50 ? '#34c759' : level > 20 ? '#ffd60a' : '#ffb340';

        async function render() {
            try {
                const [states, buttonStates] = await Promise.all([
                    statesOf(Object.values(E)),
                    Promise.all([E.ladNu, E.ladStop, E.window].map(id => callApi('GET', `states/${id}`).catch(() => null))),
                ]);
                const s = key => states[E[key]];
                // When the charging choice last changed: how long we have waited for the charger.
                const lastChange = Math.max(0, ...buttonStates.filter(Boolean).map(b => new Date(b.last_changed).getTime()));

                const level = parseFloat(s('battery'));
                const color = batteryColor(level);
                document.getElementById('soc').textContent = formatNumber(s('battery')) ?? '–';
                document.querySelector('.soc').style.color = color;
                const fill = document.getElementById('socFill');
                fill.style.width = `${Number.isNaN(level) ? 0 : level}%`;
                fill.style.background = color;

                document.getElementById('totalRange').textContent = formatNumber(s('totalRange')) ?? '–';
                document.getElementById('odometer').textContent = formatNumber(s('odometer')) ?? '–';

                const kw = (parseFloat(s('power')) || 0) / 1000;
                const charging = s('mode') === 'connected_charging';
                tiles.power.innerHTML = `${kw.toFixed(1)} <small>kW</small>`;
                tiles.power.classList.toggle('live', charging);
                document.getElementById('glow').classList.toggle('on', charging);

                // Plugged in = the Zaptec charger sees the car (its long-lived API), not the Kia cloud.
                const plugged = String(s('mode')).startsWith('connected');
                const minutes = parseFloat(s('chargeMinutes'));
                if (tiles.time) {
                    tiles.time.textContent = charging
                        ? (Number.isNaN(minutes) ? 'Charging' : hours(minutes))
                        : '–';   // plugged in or not is shown in the charger tile
                    tiles.time.classList.toggle('live', charging);
                }

                const online = document.getElementById('online');
                const isOnline = s('online') === 'on';
                online.textContent = isOnline ? 'Charger online' : 'Charger offline';
                online.className = `pill ${isOnline ? 'good' : 'fair'}`;

                // Zaptec's mode in words. "connected_finished" is also what a pause looks like, so it only counts as
                // fully charged when the car itself reports a full battery.
                const mode = s('mode');
                let [statusText, statusClass] = !isOnline || isMissing(mode) ? ['Error', 'bad']
                    : mode === 'connected_charging' ? ['Charging', 'live']
                    : mode === 'connected_finished' ? (level >= 99 ? ['Fully charged', ''] : ['Paused', 'warn'])
                    : mode === 'connected_requesting' ? ['Waiting to start', 'warn']
                    : mode === 'disconnected' ? ['Not plugged in', '']
                    : [mode, 'warn'];
                // The buttons follow what the charger actually does, like the EV apps: after a press the button spins
                // until the charger reports the new state. Starting can take minutes (Zaptec resume, or waking the
                // car through Kia), so the hint says what we are waiting for.
                const ladNuOn = s('ladNu') === 'on', ladStopOn = s('ladStop') === 'on';
                const want = (ladNuOn || s('window') === 'on') && !ladStopOn;
                const carFull = level >= 99;
                const waitingForCar = want && plugged && !charging && !carFull;
                // A press shows at once, before Home Assistant has answered.
                if (pressed && Date.now() - pressed.at > 20e3) pressed = null;
                const waited = (Date.now() - (pressed?.at ?? lastChange)) / 60e3;
                // Spin for up to 2 minutes after a change; after that the car is simply pausing (the Ceed pauses
                // for ~8 minutes by itself), and the automation wakes it through Kia after 10 minutes.
                const pendingStart = (pressed?.start && !charging) || (waitingForCar && waited < 2);
                const pendingStop = (pressed && !pressed.start && charging) || (!want && charging);
                const active = (want && plugged && !carFull) || charging;   // the button now means "stop"
                chargingNow = active;

                const first = document.getElementById('ladNuBtn');
                const busy = pendingStart || pendingStop;
                first.innerHTML = pendingStart ? '<span class="spinner"></span>Starter…'
                    : pendingStop ? '<span class="spinner"></span>Stopper…'
                    : active ? 'Stop ladning' : 'Lad nu';
                first.disabled = busy || !plugged;
                first.classList.toggle('busy', busy);
                first.classList.toggle('on', !busy && plugged && !active);   // green: you can charge
                first.classList.toggle('stop', !busy && active);             // orange: charging
                document.getElementById('folgPlanBtn').classList.toggle('on', !ladNuOn && !ladStopOn);

                let hint = '';
                if (pendingStart) {
                    statusText = 'Starting…'; statusClass = 'warn';
                    hint = mode === 'connected_finished' ? 'Asking the charger to resume' : 'Waiting for the car to draw power';
                } else if (pendingStop) {
                    statusText = 'Stopping…'; statusClass = 'warn';
                } else if (waitingForCar) {
                    statusText = 'Waiting for the car'; statusClass = 'warn';
                    hint = 'The car pauses by itself; woken after 10 min';
                } else if (!plugged && isOnline) hint = 'Plug in to charge';
                statusTile.textContent = statusText;
                statusTile.className = `tile-value status ${statusClass}`;
                statusHint.textContent = hint;

                const updated = new Date(s('updatedAt'));
                document.getElementById('updated').textContent = Number.isNaN(updated.getTime())
                    ? ''
                    : `Car data from ${updated.toLocaleString('sv-SE', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}`;

                const problems = [];
                const ageHours = (Date.now() - updated.getTime()) / 3600e3;
                if (isMissing(s('battery'))) problems.push('No data from the car (Kia cloud)');
                else if (ageHours > 24) problems.push(`Car data is ${Math.round(ageHours)} h old`);
                if (isMissing(s('mode'))) problems.push('No data from the charger (Zaptec cloud)');
                else if (!isOnline) problems.push('Charger is offline: the values may be old');
                showProblems(problems);
                showError(null);
            } catch (error) {
                showError(error);
            }
        }

        // The buttons only switch input_boolean.lad_nu / lad_stop. The automation "Ladeplan, start og stop laderen" starts
        // and stops the charger, and the load balancing keeps L1 under 20 A.
        // First button: "Stop ladning" while charging (also inside the plan's window), otherwise "Lad nu".
        let chargingNow = false;
        let pressed = null;   // { start, at }: the last press, shown until the charger confirms (max 20 s)
        const turn = (on, entity_id) => callApi('POST', `services/input_boolean/turn_${on ? 'on' : 'off'}`, { entity_id });
        const choose = (ladNu, ladStop, start) => {
            if (start !== undefined) pressed = { start, at: Date.now() };
            render();
            return Promise.all([turn(ladNu, E.ladNu), turn(ladStop, E.ladStop)])
                .then(render)
                .catch(error => { pressed = null; showError(error); render(); });
        };
        document.getElementById('ladNuBtn').addEventListener('click', () => chargingNow ? choose(false, true, false) : choose(true, false, true));
        document.getElementById('folgPlanBtn').addEventListener('click', () => choose(false, false));

        render();
        setInterval(render, 15e3);
        // Redraw the moment the charger or the buttons change, not only on the 15 s poll.
        watchEntities([E.mode, E.power, E.ladNu, E.ladStop, E.window], () => render());
    </script>
</body>
</html>
