<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strømforbrug</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        .container { overflow-y: auto; gap: 10px; padding: 18px 20px 16px; }
        .close { border: 0; background: rgba(255, 255, 255, 0.08); color: #c5d1d9; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }

        .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
        .hero-now { font-size: 54px; font-weight: 200; line-height: 1; letter-spacing: -1px; }
        .hero-now small { font-size: 18px; color: #8da0ad; font-weight: 400; letter-spacing: 0; }
        .hero-sub { margin-top: 4px; font-size: 12px; color: #8da0ad; }
        .phases { flex: 1; max-width: 330px; display: grid; gap: 7px; }
        .phase { display: grid; grid-template-columns: 22px 1fr 58px; align-items: center; gap: 8px; font-size: 12px; color: #8da0ad; }
        .phase .bar { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
        .phase .bar i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #64d2ff, #5fa8ff); transition: width .4s; }
        .phase .bar i.hot { background: linear-gradient(90deg, #ffb340, #ff6b61); }
        .phase b { text-align: right; color: #f2f5f7; font-weight: 600; }

        .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .kpi { padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
        .kpi .tile-label { text-align: left; }
        .kpi .big { margin-top: 4px; font-size: 24px; font-weight: 300; }
        .kpi .big small { font-size: 12px; color: #8da0ad; margin-left: 2px; }
        .kpi .sub { font-size: 11px; color: #6d808c; margin-top: 2px; }

        .panel { padding: 12px 14px 8px; border-radius: 14px; background: rgba(255, 255, 255, 0.06); }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .panel-title { font-size: 14px; font-weight: 600; }
        .panel-sub { font-size: 11px; color: #8da0ad; }
        .chart { position: relative; height: clamp(170px, 26vh, 300px); }
        .chart.short { height: clamp(120px, 18vh, 200px); }

        .month { display: flex; align-items: center; gap: 8px; }
        .month button { width: 30px; height: 30px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, 0.08); color: #f2f5f7; font-size: 16px; cursor: pointer; }
        .month button:disabled { opacity: .3; cursor: default; }
        .month span { min-width: 110px; text-align: center; font-size: 14px; font-weight: 600; text-transform: capitalize; }

        .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .hours { display: grid; gap: 6px; }
        .hour { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); font-size: 13px; }
        .hour .rank { color: #6d808c; font-weight: 600; }
        .hour .when { color: #c5d1d9; }
        .hour .kw { font-weight: 600; color: #ffb340; }
        .empty { padding: 10px 2px; font-size: 12px; color: #8da0ad; line-height: 1.5; }
        @media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } .hero { flex-direction: column; align-items: stretch; } .phases { max-width: none; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="head">
            <span class="name">Strømforbrug <span class="muted">· hele huset</span></span>
            <button class="close" id="close" aria-label="Close">✕</button>
        </div>
        <div id="error" class="error" hidden></div>
        <div id="problems" class="problems" hidden></div>

        <div class="hero">
            <div>
                <div class="hero-now"><span id="power">–</span><small> kW</small></div>
                <div class="hero-sub" id="heroSub"></div>
            </div>
            <div class="phases" id="phases"></div>
        </div>

        <div class="month">
            <button id="prev" aria-label="Previous month">‹</button><span id="monthLabel"></span><button id="next" aria-label="Next month">›</button>
        </div>

        <div class="kpis">
            <div class="kpi"><div class="tile-label">Month total</div><div class="big" id="kTotal">–</div><div class="sub" id="kTotalSub"></div></div>
            <div class="kpi"><div class="tile-label">Month cost</div><div class="big" id="kCost">–</div><div class="sub" id="kCostSub"></div></div>
            <div class="kpi"><div class="tile-label">Average day</div><div class="big" id="kAvg">–</div><div class="sub" id="kAvgSub"></div></div>
            <div class="kpi"><div class="tile-label">Highest day</div><div class="big" id="kMax">–</div><div class="sub" id="kMaxSub"></div></div>
            <div class="kpi"><div class="tile-label">Today</div><div class="big" id="kToday">–</div><div class="sub" id="kTodaySub"></div></div>
        </div>

        <div class="panel">
            <div class="panel-head"><span class="panel-title">Per day</span><span class="panel-sub">kWh, hover for cost · weekends dimmed</span></div>
            <div class="chart"><canvas id="dayChart"></canvas></div>
        </div>

        <div class="two">
            <div class="panel">
                <div class="panel-head"><span class="panel-title">A typical day</span><span class="panel-sub">average kW per hour this month</span></div>
                <div class="chart short"><canvas id="hourChart"></canvas></div>
            </div>
            <div class="panel">
                <div class="panel-head"><span class="panel-title">Highest hours</span><span class="panel-sub">kWh and cost in one hour</span></div>
                <div class="hours" id="topHours"></div>
            </div>
        </div>
        <div class="empty" id="note"></div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        const E = {
            power: 'sensor.p1_meter_elektrisk_effekt',
            phases: ['sensor.p1_meter_power_phase_1', 'sensor.p1_meter_power_phase_2', 'sensor.p1_meter_power_phase_3'],
            importKwh: 'sensor.p1_meter_energy_import',
        };
        document.getElementById('close').addEventListener('click', () => closePopup());

        const MAX_PHASE_W = 5500;   // 25 A at 230 V: where a phase bar is full
        const phasesEl = document.getElementById('phases');
        const phaseRows = ['L1', 'L2', 'L3'].map(name => {
            const row = document.createElement('div');
            row.className = 'phase';
            row.innerHTML = `<span>${name}</span><div class="bar"><i></i></div><b>–</b>`;
            phasesEl.append(row);
            return { bar: row.querySelector('i'), text: row.querySelector('b') };
        });

        const kwh = (v, d = 1) => v === null || Number.isNaN(v) ? '–' : `${v.toLocaleString('sv-SE', { minimumFractionDigits: d, maximumFractionDigits: d })}<small> kWh</small>`;
        let month = new Date(); month.setDate(1); month.setHours(0, 0, 0, 0);
        const thisMonth = new Date(month);
        let dayChart = null, hourChart = null;

        // Long-term statistics of the energy counter: per day and per hour, as "change" (kWh used in the period).
        async function stats(period, start, end) {
            const result = await callWS({ type: 'recorder/statistics_during_period', start_time: start.toISOString(), end_time: end.toISOString(), statistic_ids: [E.importKwh], period, types: ['change'] });
            return ((result && result[E.importKwh]) || []).map(r => ({ start: new Date(r.start), change: r.change }));
        }

        async function live() {
            const states = await statesOf([E.power, ...E.phases]);
            const p = parseFloat(states[E.power]);
            document.getElementById('power').textContent = Number.isNaN(p) ? '–' : formatNumber(p / 1000, 2);
            document.getElementById('heroSub').textContent = Number.isNaN(p) ? 'The P1 meter is not delivering data' : p < 0 ? 'exporting to the grid' : 'drawn from the grid right now';
            E.phases.forEach((id, i) => {
                const w = parseFloat(states[id]);
                phaseRows[i].text.textContent = Number.isNaN(w) ? '–' : `${formatNumber(w, 0)} W`;
                phaseRows[i].bar.style.width = `${Number.isNaN(w) ? 0 : Math.max(0, Math.min(100, w / MAX_PHASE_W * 100))}%`;
                phaseRows[i].bar.classList.toggle('hot', w > 3500);
            });
            showProblems(isMissing(states[E.power]) ? ['The P1 meter is not delivering data (check HomeWizard and its Wi-Fi)'] : []);
        }

        async function history() {
            const start = new Date(month), end = new Date(month); end.setMonth(end.getMonth() + 1);
            const now = new Date();
            const until = end > now ? now : end;
            document.getElementById('monthLabel').textContent = month.toLocaleDateString('sv-SE', { month: 'long', year: 'numeric' });
            document.getElementById('next').disabled = +month >= +thisMonth;

            // Hourly kWh: compiled hourly statistics, topped up with the 5-minute statistics for the newest hours.
            const hourly = await stats('hour', start, until);
            const lastHour = hourly.length ? +hourly[hourly.length - 1].start + 3600e3 : +start;
            const five = lastHour < +until ? await stats('5minute', new Date(lastHour), until) : [];
            const extra = new Map();
            for (const f of five) { if (f.change == null) continue; const h = Math.floor(+f.start / 3600e3) * 3600e3; extra.set(h, (extra.get(h) || 0) + f.change); }
            const hours = [...hourly, ...[...extra].map(([h, change]) => ({ start: new Date(h), change }))].filter(h => h.change != null);

            // Price of every hour that has data, fetched day by day.
            const dayKeys = [...new Set(hours.map(h => localDateString(h.start)))];
            const priceMaps = await Promise.all(dayKeys.map(hourlyTotalPrices));
            const priceAt = new Map(); priceMaps.forEach(m => m.forEach((v, k) => priceAt.set(k, v)));
            for (const h of hours) h.cost = priceAt.has(+h.start) ? h.change * priceAt.get(+h.start) / 100 : null;   // kr

            const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
            const dayKwh = Array(daysInMonth).fill(null), dayCost = Array(daysInMonth).fill(0), dayUnpriced = Array(daysInMonth).fill(false);
            for (const h of hours) {
                const i = h.start.getDate() - 1;
                dayKwh[i] = (dayKwh[i] || 0) + h.change;
                if (h.cost === null) dayUnpriced[i] = true; else dayCost[i] += h.cost;
            }
            const known = dayKwh.filter(v => v !== null);
            const total = known.reduce((s, v) => s + v, 0);
            const monthCost = dayCost.reduce((s, v) => s + v, 0);
            const anyUnpriced = dayUnpriced.some(Boolean);
            const kr = v => `${v.toLocaleString('sv-SE', { minimumFractionDigits: v < 100 ? 1 : 0, maximumFractionDigits: v < 100 ? 1 : 0 })}<small> kr</small>`;

            document.getElementById('kTotal').innerHTML = known.length ? kwh(total, 0) : '–';
            document.getElementById('kTotalSub').textContent = known.length ? `${known.length} day${known.length > 1 ? 's' : ''} of data` : 'no data yet';
            document.getElementById('kCost').innerHTML = known.length ? kr(monthCost) : '–';
            document.getElementById('kCostSub').textContent = !known.length ? '' : anyUnpriced ? 'some hours without a price' : `${formatNumber(monthCost / total * 100, 0)} öre/kWh on average`;
            document.getElementById('kAvg').innerHTML = known.length ? kwh(total / known.length, 1) : '–';
            document.getElementById('kAvgSub').textContent = known.length ? `${kr(monthCost / known.length).replace(/<[^>]+>/g, '')} per day` : '';
            const maxDay = known.length ? Math.max(...known) : null;
            document.getElementById('kMax').innerHTML = maxDay === null ? '–' : kwh(maxDay, 1);
            document.getElementById('kMaxSub').textContent = maxDay === null ? '' : `${dayKwh.indexOf(maxDay) + 1} ${month.toLocaleDateString('sv-SE', { month: 'short' })}`;
            const todayIdx = +month === +thisMonth ? new Date().getDate() - 1 : -1;
            document.getElementById('kToday').innerHTML = todayIdx >= 0 && dayKwh[todayIdx] !== null ? kwh(dayKwh[todayIdx], 1) : '–';
            document.getElementById('kTodaySub').textContent = todayIdx >= 0 && dayKwh[todayIdx] !== null ? `${kr(dayCost[todayIdx]).replace(/<[^>]+>/g, '')} so far` : '';

            const labels = Array.from({ length: daysInMonth }, (_, i) => i + 1);
            const colour = i => {
                const date = new Date(month.getFullYear(), month.getMonth(), i + 1), weekend = [0, 6].includes(date.getDay());
                return i === todayIdx ? '#ffb340' : weekend ? 'rgba(100,210,255,0.35)' : 'rgba(100,210,255,0.85)';
            };
            if (dayChart) dayChart.destroy();
            dayChart = new Chart(document.getElementById('dayChart'), {
                type: 'bar',
                data: { labels, datasets: [{ data: dayKwh, backgroundColor: labels.map((_, i) => colour(i)), borderRadius: 4, borderSkipped: false, maxBarThickness: 26 }] },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    scales: { x: { ticks: { color: '#8da0ad', maxTicksLimit: 16 }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: '#8da0ad', maxTicksLimit: 5 }, grid: { color: 'rgba(255,255,255,0.07)' } } },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => `${i[0].label} ${month.toLocaleDateString('sv-SE', { month: 'long' })}`, label: i => `${formatNumber(i.parsed.y, 1)} kWh · ${formatNumber(dayCost[i.dataIndex], dayCost[i.dataIndex] < 100 ? 1 : 0)} kr` } } },
                },
            });

            // Average kW for each hour of the day over the month.
            const byHour = Array.from({ length: 24 }, () => []);
            for (const h of hours) if (h.change != null) byHour[h.start.getHours()].push(h.change);
            const avg = byHour.map(a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null);
            if (hourChart) hourChart.destroy();
            hourChart = new Chart(document.getElementById('hourChart'), {
                type: 'line',
                data: { labels: avg.map((_, i) => String(i).padStart(2, '0')), datasets: [{ data: avg, borderColor: '#5fe085', backgroundColor: 'rgba(95,224,133,0.16)', fill: true, pointRadius: 0, borderWidth: 2, tension: 0.35, spanGaps: true }] },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    scales: { x: { ticks: { color: '#8da0ad', maxTicksLimit: 8 }, grid: { display: false } }, y: { beginAtZero: true, ticks: { color: '#8da0ad', maxTicksLimit: 4 }, grid: { color: 'rgba(255,255,255,0.07)' } } },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => `${i[0].label}:00`, label: i => `${formatNumber(i.parsed.y, 2)} kW` } } },
                },
            });

            const top = hours.slice().sort((a, b) => b.change - a.change).slice(0, 5);
            const list = document.getElementById('topHours');
            list.replaceChildren(...top.map((h, i) => {
                const row = document.createElement('div');
                row.className = 'hour';
                const to = new Date(h.start.getTime() + 3600e3);
                row.innerHTML = `<span class="rank">${i + 1}</span><span class="when">${h.start.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' })} · ${String(h.start.getHours()).padStart(2, '0')}–${String(to.getHours()).padStart(2, '0')}</span><span class="kw">${formatNumber(h.change, 2)} kWh${h.cost === null ? '' : ` · ${formatNumber(h.cost, 1)} kr`}</span>`;
                return row;
            }));
            if (!top.length) list.innerHTML = '<div class="empty">No complete hours yet.</div>';
            document.getElementById('note').textContent = known.length < 3 && +month === +thisMonth
                ? 'The meter was connected on 20 October 2026, so the history starts there and fills up day by day. Earlier consumption cannot be fetched from the grid company.' : '';
        }

        document.getElementById('prev').addEventListener('click', () => { month.setMonth(month.getMonth() - 1); history().catch(showError); });
        document.getElementById('next').addEventListener('click', () => { month.setMonth(month.getMonth() + 1); history().catch(showError); });

        live().catch(showError);
        history().catch(showError);
        setInterval(() => live().catch(() => {}), 5e3);
        setInterval(() => history().catch(() => {}), 5 * 60e3);
    </script>
</body>
</html>
