<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elpris</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .head { position: relative; }
        .info { color: #6d808c; font-size: 14px; font-weight: 400; cursor: help; outline: none; }
        .info-box {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 200;
            margin-top: 6px;
            padding: 8px 10px;
            text-align: left;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.5;
            color: #e5ecf0;
            background: #0b1218;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
        }
        .info:hover .info-box, .info:focus .info-box { display: block; }

        .legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 7px 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: #c5d1d9;
            font-size: 13px;
            white-space: nowrap;
        }
        .legend-box { width: 24px; height: 4px; margin-left: 8px; border-radius: 2px; }
        .legend-box:first-child { margin-left: 0; }
        .legend-box.shave { background: #34c759; }
        .legend-box.normal { background: #ff9500; }

        .chart-wrapper { position: relative; flex: 1; min-height: 0; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 8px; }
        .tile.static { cursor: default; }
        .tile.static:hover { background: rgba(255, 255, 255, 0.06); }
        .tile-value { color: var(--accent); }
    </style>
    <script src="/local/card-common.js?v=1"></script>
</head>
<body>
    <div class="container">
        <div class="head">
            <span class="name"><span id="title"></span> <span class="muted" id="subtitle"></span> <span class="info" tabindex="0" aria-label="Details">ⓘ<div class="info-box" id="infoBox"></div></span></span>
        </div>

        <div id="error" class="error" hidden></div>

        <div id="legend" class="legend" hidden>
            <span class="legend-box shave"></span><span><strong>Peak shaving</strong></span>
            <span class="legend-box normal"></span><span><strong>Normal</strong></span>
        </div>

        <div class="chart-wrapper"><canvas id="chart"></canvas></div>

        <div class="stats">
            <div class="tile static"><div class="tile-label">Now</div><div class="tile-value" id="now">–</div></div>
        </div>
    </div>

    <script>
        const CONFIG_ENTRY = '01M4G69T394M8BKNHBNQ9E0246';
        const AREA = 'SE3';
        const HOUR = 3600e3;

        // Greenely price = (hourly spot + fees) × VAT. Fees fitted to two Greenely readings on 2026-10-09
        // (spot 46.80 → 91 öre, spot 76.40 → 128 öre): slope is exactly 1.25, so fees = 26 öre before VAT.
        // Total = Greenely + Ellevio grid fee + energy tax (both billed incl. VAT). See docs/elpriskalkulator.md.
        const SUPPLIER_FEES_ORE = 26;
        const VAT = 1.25;
        const GRID_FEE_ORE = 26;
        const ENERGY_TAX_ORE = 45;

        // Peak shaving rules (see docs/peak-shaving-rules.md): per calendar day, up to PEAK_MAX_BLOCKS blocks of
        // PEAK_BLOCK_HOURS in a row, at least PEAK_RECOVERY_HOURS apart, each at least PEAK_MIN_PREMIUM times
        // the day's average spot price and at least PEAK_MIN_SPREAD_ORE öre/kWh dearer than the 4 hours after it.
        // The plan depends only on the day's published prices.
        const PEAK_BLOCK_HOURS = 2;
        const PEAK_MAX_BLOCKS = 2;
        const PEAK_RECOVERY_HOURS = 2;
        const PEAK_MIN_PREMIUM = 1.25;
        const PEAK_MIN_SPREAD_ORE = 40;
        let peaks = new Set();

        const MODE = new URLSearchParams(location.search).get('mode') === 'total' ? 'total' : 'spot';
        const VIEW = MODE === 'total'
            ? {
                title: 'Electricity',
                subtitle: 'price',
                info: [
                    'Nord Pool spot (SE3), hourly average of the 15-minute prices',
                    `+ ${SUPPLIER_FEES_ORE} öre supplier fees (Greenely), then × ${VAT} VAT`,
                    `+ ${GRID_FEE_ORE} öre grid fee (Ellevio), incl. VAT`,
                    `+ ${ENERGY_TAX_ORE} öre energy tax, incl. VAT`,
                    `Peak shaving: up to ${PEAK_MAX_BLOCKS} blocks of ${PEAK_BLOCK_HOURS} h a day, only if ${Math.round((PEAK_MIN_PREMIUM - 1) * 100)}% above the day's average spot and at least ${PEAK_MIN_SPREAD_ORE} öre/kWh dearer than the 4 hours after`,
                ],
                color: '#34c759',
                toPrice: spot => (spot + SUPPLIER_FEES_ORE) * VAT + GRID_FEE_ORE + ENERGY_TAX_ORE,
            }
            : {
                title: 'Nord Pool',
                subtitle: 'spot price',
                info: ['Nord Pool spot (SE3), hourly average of the 15-minute prices, excl. VAT'],
                color: '#64d2ff',
                toPrice: spot => spot,
            };

        document.documentElement.style.setProperty('--accent', VIEW.color);
        document.getElementById('title').textContent = VIEW.title;
        document.getElementById('subtitle').textContent = VIEW.subtitle;
        for (const line of VIEW.info) {
            const row = document.createElement('div');
            row.textContent = line;
            document.getElementById('infoBox').append(row);
        }
        document.getElementById('legend').hidden = MODE !== 'total';

        let chart = null;

        function localDate(offsetDays) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            return d.toLocaleDateString('sv-SE');
        }

        async function pricesFor(date) {
            const body = await callApi('POST', 'services/nordpool/get_prices_for_date?return_response', {
                config_entry: CONFIG_ENTRY,
                date,
                areas: AREA,
            });
            return body.service_response[AREA].map(p => ({
                start: new Date(p.start).getTime(),
                end: new Date(p.end).getTime(),
                ore: p.price / 10, // SEK/MWh → öre/kWh
            }));
        }

        // Each hour is the average of its four 15-minute spot prices (Greenely bills hourly).
        function hourlyAverage(slots) {
            const byHour = new Map();
            for (const s of slots) {
                const start = Math.floor(s.start / HOUR) * HOUR;
                if (!byHour.has(start)) byHour.set(start, []);
                byHour.get(start).push(s.ore);
            }
            return [...byHour].map(([start, ores]) => ({
                start,
                end: start + HOUR,
                ore: ores.reduce((a, b) => a + b, 0) / ores.length,
            }));
        }

        // allHours: every known hourly price (today and tomorrow), so the 4 hours after a late block can run
        // into the next day.
        function peakHours(day, allHours = day) {
            const mean = day.reduce((sum, s) => sum + s.ore, 0) / day.length;
            const oreAt = new Map(day.map(s => [s.start, s.ore]));
            const oreAnyDay = new Map(allHours.map(s => [s.start, s.ore]));
            const windows = day
                .map(s => s.start)
                .filter(start => oreAt.has(start + HOUR))
                .map(start => ({ start, avg: (oreAt.get(start) + oreAt.get(start + HOUR)) / 2 }))
                .sort((a, b) => b.avg - a.avg);

            // How much cheaper the 4 hours after a block are, in öre/kWh you pay. That is where the held-back
            // heat is made up, so that gap is what a block saves per kWh it shifts. The 4 hours may run into
            // the next day; if any of them is not published yet, the block does not count (no free pass).
            const spreadAfter = w => {
                const after = [2, 3, 4, 5].map(k => oreAnyDay.get(w.start + k * HOUR));
                if (after.some(v => v === undefined)) return -Infinity;
                return (w.avg - after.reduce((a, b) => a + b) / after.length) * VAT;
            };

            // Blocks are chosen by saving, not by price: on a long plateau the end of it saves most, because
            // the held-back heat is then made up in cheaper hours.
            const minStartDistance = (PEAK_BLOCK_HOURS + PEAK_RECOVERY_HOURS) * HOUR;
            const candidates = windows
                .filter(w => w.avg >= mean * PEAK_MIN_PREMIUM)
                .map(w => ({ ...w, saving: spreadAfter(w) }))
                .filter(w => w.saving >= PEAK_MIN_SPREAD_ORE)
                .sort((a, b) => b.saving - a.saving);
            const blocks = [];
            for (const w of candidates) {
                if (blocks.length >= PEAK_MAX_BLOCKS) break;
                if (blocks.every(b => Math.abs(b.start - w.start) >= minStartDistance)) blocks.push(w);
            }
            return new Set(blocks.flatMap(b => [b.start, b.start + HOUR]));
        }

        function isPeakShaving(now, offsetHours) {
            return peaks.has(Math.floor((now + offsetHours * HOUR) / HOUR) * HOUR);
        }

        function clockTime(now, offsetHours) {
            const t = new Date(now + offsetHours * HOUR);
            const day = t.toLocaleDateString('sv-SE', { weekday: 'short' });
            return day + ' ' + t.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
        }

        function axisLabel(now, offsetHours) {
            return String(new Date(now + offsetHours * HOUR).getHours()).padStart(2, '0');
        }

        const SHAVING_COLOR = '#34c759';
        // A flat piece (one hour) takes its own hour's colour. A vertical step takes green if the hour before or
        // the hour after it is planned, so a green block is framed by green steps on both sides. The 1 s nudges
        // keep the boundary x inside the intended hour despite floating-point rounding.
        const NUDGE = 1000 / HOUR;
        function pieceColor(now, ctx) {
            const isFlat = ctx.p0.parsed.x !== ctx.p1.parsed.x;
            const shaving = isFlat
                ? isPeakShaving(now, ctx.p0.parsed.x + NUDGE)
                : isPeakShaving(now, ctx.p0.parsed.x - NUDGE) || isPeakShaving(now, ctx.p1.parsed.x + NUDGE);
            return shaving ? SHAVING_COLOR : NORMAL_COLOR;
        }
        const NORMAL_COLOR = '#ff9500';

        const nowLine = {
            id: 'nowLine',
            afterDatasetsDraw(chart) {
                const { ctx, chartArea: area, scales: { x } } = chart;
                const px = x.getPixelForValue(0);
                ctx.save();
                ctx.strokeStyle = '#ff453a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px, area.top);
                ctx.lineTo(px, area.bottom);
                ctx.stroke();
                ctx.restore();
            },
        };

        // Tomorrow's prices are published around 13:00; until then, say so in the empty part of the axis.
        function pendingNote(lastX) {
            return {
                id: 'pendingNote',
                afterDatasetsDraw(chart) {
                    const { ctx, chartArea: area, scales: { x } } = chart;
                    const dataEnd = x.getPixelForValue(lastX);
                    if (area.right - dataEnd < 80) return;
                    ctx.save();
                    ctx.fillStyle = '#6d808c';
                    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const centerX = (dataEnd + area.right) / 2;
                    const centerY = (area.top + area.bottom) / 2;
                    ctx.fillText("Tomorrow's prices", centerX, centerY - 8);
                    ctx.fillText('arrive around 13:00', centerX, centerY + 8);
                    ctx.restore();
                },
            };
        }

        function draw(points, now, from, to) {
            // Like Greenely: 06 12 18 00 06 12 18 (no label at the very start).
            const hourTicks = [];
            for (let t = from + HOUR; t < to; t += HOUR) {
                if (new Date(t).getHours() % 6 === 0) hourTicks.push({ value: (t - now) / HOUR });
            }

            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('chart'), {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'öre/kWh',
                        data: points,
                        borderColor: VIEW.color,
                        backgroundColor: VIEW.color + '22',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        segment: MODE === 'total' ? {
                            borderColor: ctx => pieceColor(now, ctx),
                            backgroundColor: ctx => pieceColor(now, ctx) + '33',
                        } : {},
                    }],
                },
                options: {
                    animation: false,
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            displayColors: false,
                            backgroundColor: '#0b1218',
                            borderColor: 'rgba(255, 255, 255, 0.15)',
                            borderWidth: 1,
                            titleColor: '#8da0ad',
                            bodyColor: '#f2f5f7',
                            callbacks: {
                                title: items => clockTime(now, items[0].raw.hourStart),
                                label: item => `${item.parsed.y.toFixed(1)} öre/kWh`,
                            },
                        },
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: (from - now) / HOUR,
                            max: (to - now) / HOUR,
                            afterBuildTicks: axis => { axis.ticks = hourTicks; },
                            ticks: { color: '#8da0ad', font: { size: 11 }, maxRotation: 0, autoSkip: false, callback: value => axisLabel(now, value) },
                            grid: { display: false },
                        },
                        y: {
                            ticks: { color: '#8da0ad', font: { size: 11 } },
                            grid: { color: 'rgba(255, 255, 255, 0.08)' },
                        },
                    },
                },
                plugins: [nowLine, pendingNote(points[points.length - 1].x)],
            });
        }

        async function render() {
            const errorBox = document.getElementById('error');
            try {
                const now = Date.now();
                // Fixed two-day axis like Greenely: 00:00 today to 23:59 tomorrow.
                const today = new Date(now);
                const from = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();
                const to = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 2).getTime();

                const [todayPrices, tomorrowPrices] = await Promise.all([
                    pricesFor(localDate(0)),
                    pricesFor(localDate(1)).catch(() => []), // tomorrow's prices are published around 13:00
                ]);
                const days = [todayPrices, tomorrowPrices].map(hourlyAverage);
                // Only plan days with complete prices (tomorrow's are published around 13:00).
                peaks = new Set(days.filter(day => day.length >= 23).flatMap(day => [...peakHours(day, days.flat())]));

                const slots = days
                    .flat()
                    .filter(s => s.end > from && s.start < to)
                    .sort((a, b) => a.start - b.start);
                if (!slots.length) throw new Error('No price data from Nord Pool');

                // Two points per hour (start and end) instead of a stepped line: the vertical step between two
                // hours is then its own piece, and can be coloured green if either neighbouring hour is planned.
                const points = slots.flatMap(s => {
                    const y = VIEW.toPrice(s.ore);
                    const hourStart = (s.start - now) / HOUR;
                    return [{ x: hourStart, y, hourStart }, { x: (s.end - now) / HOUR, y, hourStart }];
                });

                draw(points, now, from, to);

                const current = slots.find(s => s.start <= now && now < s.end);
                const fmt = v => `${v.toFixed(1)} öre`;
                document.getElementById('now').textContent = current ? fmt(VIEW.toPrice(current.ore)) : '–';
                errorBox.hidden = true;
            } catch (error) {
                errorBox.textContent = error.message || error.error || 'Request failed';
                errorBox.hidden = false;
            }
        }

        render();
        setInterval(render, 60e3);
    </script>
</body>
</html>
