<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Debug</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .container { gap: 12px; padding: 20px; }
        .sensor { padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.06); border-left: 3px solid #64d2ff; }
        .sensor.supply { border-left-color: #5fe085; }
        .sensor.return { border-left-color: #ff9500; }
        .label { font-size: 12px; color: #8da0ad; text-transform: uppercase; }
        .value { margin-top: 8px; font-size: 48px; font-weight: 300; }
        .sub { margin-top: 4px; font-size: 12px; color: #6d808c; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌡️ Temp Sensors (Live Debug)</h1>
        <div class="grid" id="sensors"></div>
        <div style="margin-top: 20px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.04); font-size: 12px; color: #8da0ad;" id="debug"></div>
    </div>

    <script>
        const E = {
            supply: 'sensor.varmepumpe_temp_heatpump_supply_temperature',
            return: 'sensor.varmepumpe_temp_heatpump_return_temperature',
        };

        async function callApi(method, path) {
            const token = localStorage.getItem('ha_token') || '';
            const res = await fetch(`http://homeassistant-1.tailb28837.ts.net/api/${path}`, {
                method, headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error(`API error: ${res.status}`);
            return await res.json();
        }

        async function update() {
            try {
                const states = await callApi('GET', 'states');
                const supply = parseFloat(states.find(s => s.entity_id === E.supply)?.state);
                const returnTemp = parseFloat(states.find(s => s.entity_id === E.return)?.state);
                const deltaT = !isNaN(supply) && !isNaN(returnTemp) ? supply - returnTemp : null;

                const sensor = (label, value, unit, className) =>
                    `<div class="sensor ${className}"><div class="label">${label}</div><div class="value">${isNaN(value) ? '–' : value.toFixed(2)}<small style="font-size:24px">${unit}</small></div></div>`;

                document.getElementById('sensors').innerHTML =
                    sensor('Supply (DS18B20)', supply, '°C', 'supply') +
                    sensor('Return (NTC)', returnTemp, '°C', 'return') +
                    sensor('ΔT (Difference)', deltaT, '°C', 'supply');

                const now = new Date().toLocaleTimeString('da-DK');
                document.getElementById('debug').innerHTML =
                    `<b>Last update:</b> ${now}<br>` +
                    `<b>Supply state:</b> ${states[E.supply]}<br>` +
                    `<b>Return state:</b> ${states[E.return]}<br>` +
                    `<b>Supply valid:</b> ${!isNaN(supply) ? 'YES ✓' : 'NO ✗'}<br>` +
                    `<b>Return valid:</b> ${!isNaN(returnTemp) ? 'YES ✓' : 'NO ✗'}`;
            } catch (e) {
                document.getElementById('debug').innerHTML = `<b style="color:#ff6b61">Error:</b> ${e.message}`;
            }
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
