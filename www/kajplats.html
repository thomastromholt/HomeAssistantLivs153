<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kajplats</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
        .btn { padding: 16px; border-radius: 12px; border: 0; font-size: 14px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
        .btn.on { background: #5fe085; color: #000; }
        .btn.off { background: rgba(255,255,255,0.08); color: #e8eef5; }
        .btn:active { transform: scale(0.95); }
        .status { font-size: 12px; margin-top: 4px; color: #6d808c; text-align: center; }
    </style>
</head>
<body>
    <div class="container" id="root">
        <div class="head">
            <span class="name">Kajplats</span>
        </div>
        <div id="error" class="error" hidden></div>

        <div class="buttons">
            <div>
                <button class="btn" id="btn1000" data-entity="light.kajplats_e27_ws_globe_1055lm">1000 lm</button>
                <div class="status" id="status1000">–</div>
            </div>
            <div>
                <button class="btn" id="btn1500" data-entity="light.kajplats_e27_ws_globe_1521lm">1500 lm</button>
                <div class="status" id="status1500">–</div>
            </div>
        </div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        const E = {
            lamp1000: 'light.kajplats_e27_ws_globe_1055lm',
            lamp1500: 'light.kajplats_e27_ws_globe_1521lm',
        };

        document.getElementById('btn1000').addEventListener('click', async () => {
            const state = await s('lamp1000');
            const action = state === 'on' ? 'light.turn_off' : 'light.turn_on';
            await callApi(`/api/services/light/${action.split('.')[1]}`, {
                entity_id: E.lamp1000
            });
            load();
        });

        document.getElementById('btn1500').addEventListener('click', async () => {
            const state = await s('lamp1500');
            const action = state === 'on' ? 'light.turn_off' : 'light.turn_on';
            await callApi(`/api/services/light/${action.split('.')[1]}`, {
                entity_id: E.lamp1500
            });
            load();
        });

        async function load() {
            try {
                const states = await statesOf(Object.values(E));
                const s = key => states[E[key]];

                const state1000 = s('lamp1000');
                const state1500 = s('lamp1500');

                const btn1000 = document.getElementById('btn1000');
                const btn1500 = document.getElementById('btn1500');
                btn1000.textContent = state1000 === 'on' ? '✓ 1000 lm' : '1000 lm';
                btn1000.className = `btn ${state1000 === 'on' ? 'on' : 'off'}`;
                document.getElementById('status1000').textContent = state1000 === 'unavailable' ? 'unavailable' : state1000;

                btn1500.textContent = state1500 === 'on' ? '✓ 1500 lm' : '1500 lm';
                btn1500.className = `btn ${state1500 === 'on' ? 'on' : 'off'}`;
                document.getElementById('status1500').textContent = state1500 === 'unavailable' ? 'unavailable' : state1500;

                showError(null);
            } catch (error) {
                showError(error);
            }
        }

        load();
        setInterval(load, 5e3);
    </script>
</body>
</html>
