<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strømforbrug</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        .head-r { display: flex; align-items: center; gap: 8px; }
        .gear { border: 0; background: none; color: #6d808c; font-size: 17px; line-height: 1; cursor: pointer; padding: 0 2px; }
        .gear:hover { color: #c5d1d9; }
        .now { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 0; }
        .now button { border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer; padding: 0; }
        .now-value { font-size: 44px; font-weight: 300; line-height: 1.05; white-space: nowrap; }
        .now-value small { font-size: 16px; color: #8da0ad; }
        .now-note { font-size: 11px; color: #6d808c; line-height: 1.25; max-width: 110px; }
        .range { margin-left: auto; align-self: center; display: flex; gap: 4px; }
        .range button { padding: 3px 9px; border: 0; border-radius: 8px; background: rgba(255,255,255,.06); color: #8da0ad; font: inherit; font-size: 11px; cursor: pointer; }
        .range button.on { background: rgba(100,210,255,.2); color: #64d2ff; }

        .chart { flex: 1; min-height: 70px; position: relative; margin: 4px 0 6px; cursor: pointer; }
        .mix { margin-top: 6px; padding: 8px 12px 9px; border-radius: 12px; background: rgba(255,255,255,.06); cursor: pointer; }
        .mix-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #8da0ad; text-transform: uppercase; letter-spacing: .6px; }
        .mix-head b { color: #f2f5f7; font-size: 17px; letter-spacing: 0; text-transform: none; font-weight: 600; }
        .mix-head small { font-size: 12px; font-weight: 400; color: #8da0ad; text-transform: none; letter-spacing: 0; }
        .bar { display: flex; height: 10px; margin: 7px 0 6px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.08); }
        .bar i { display: block; height: 100%; transition: width .4s; }
        .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 4px; font-size: 11px; color: #8da0ad; }
        .legend > span { display: flex; flex-direction: column; }
        .legend > span > span { display: flex; align-items: center; }
        .legend b { color: #f2f5f7; font-size: 13px; font-weight: 600; }
        .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="head"><span class="name">Strømforbrug</span><span class="head-r"><button class="gear" id="gear" title="Dataforbrug: hvor meget der sendes i dag og denne måned" aria-label="Dataforbrug">⚙</button><span class="pill" id="pill"></span></span></div>
        <div id="error" class="error" hidden></div>

        <div class="now">
            <button id="nowButton"><span class="now-value"><span id="power">–</span><small id="unit"> kW</small></span></button>
            <span class="now-note" id="note"></span>
            <div class="range" id="range"><button data-h="0.17">10 m</button><button data-h="1" class="on">1 h</button><button data-h="6">6 h</button><button data-h="24">24 h</button></div>
        </div>
        <div class="chart" id="chartBox"><canvas id="chart"></canvas></div>

        <div class="mix" id="mix">
            <div class="mix-head"><span id="mixLabel">I dag</span><span><b id="mixTotal">–</b> <small id="mixCost"></small></span></div>
            <div class="bar" id="bar"></div>
            <div class="legend" id="legend"></div>
        </div>
    </div>

    <script src="/local/card-common.js?v=2"></script>
    <script>
        /* Strømforbrug at the cottage, built like the card at home (hus.html).
           Live (Tibber Pulse online): the power now, and the last 1 h / 6 h / 24 h as stacked areas: El-varme (Mill without the heat pump's socket), Varmepumpe (its socket), the EV charger and
           everything else (= the Pulse total minus those). "I dag" underneath is today's kWh and what it cost, split the same way.
           Pulse offline: the meter's own history through Tibber (hourly statistics, about a day late) takes its place, so the card
           shows the last 24 hours it has, split into the same groups. Pressing the card opens the dialog (stugan-strom.html).
           The sensors are found by themselves (entity registry, statistic ids). */
        const DEMO = new URLSearchParams(location.search).has('demo');
        const COLORS = { mill: '#ffb340', vp: '#c792ea', vv: '#ff7a8a', sensibo: '#34d1b8', ev: '#5fe085', rest: '#64d2ff' };
        const NAMES = { mill: 'El-varme', vp: 'Varmepumpe', vv: 'Varmtvand', sensibo: 'Sensibo', ev: 'Elbil', rest: 'Resten' };
        const f = (v, d) => v.toLocaleString('da-DK', { minimumFractionDigits: d, maximumFractionDigits: d });
        const isOk = s => s && !['unavailable', 'unknown'].includes(s.state);
        // The heat pump's power factor changes with load: about 0.82 at a quiet 3 A and about 0.98 from 5 A (measured 2026-11-20 against the whole
        // house's power with everything else off), so watt = volt x amp x pf(amp) with the amps above the baseline. With pf = 1 the quiet
        // state was over-counted by ~130 W and "Resten" fell from 180 W to ~50 W.
        const hpPf = dA => { const x = Math.min(1, Math.max(0, (dA - 3) / 2)); return 0.82 + 0.16 * x * x * (3 - 2 * x); };
        // Radiators on L1, next to the heat pump (measured with the stepwise test 2026-11-20: Sovrum, Farstu, Teknikrum and the guest cottage on L1, Stuen on L2,
        // Barnrum on L3; each 0.57-0.73 kW). With the heat pump running the Pulse cannot tell the L1 radiators from it, so they are counted from Mill:
        // a panel is ON when its room is colder than the setpoint it follows (the thermostat's call), with Mill's own reported power if it reports one and
        // otherwise a typical 650 W (Mill reports 0 W for a panel that was just switched on, and then nothing for up to 10 minutes).
        const L1_ROOMS = ['sovrum', 'farstu', 'teknikrum', 'gäststuga', 'gaeststuga'], RAD_W = 650;
        let millPow = new Map(), millPowAt = 0;
        // ON: the panel reports power and the room is under its setpoint, or the room is clearly (1 degree) under it (Mill reports 0 W for a panel just switched on, so a
        // room far under its setpoint is assumed to heat). A room only a little under its setpoint is not assumed to (the thermostat's pause band): the guest cottage at 6.6 against 7 was
        // wrongly counted as 650 W on 2026-11-20, while the Pulse showed nothing. An offline panel (the Mill app says so) is not counted.
        const radOn = r => { const m = r.mode === 'weekly_program' ? r.activeModeFromWeeklyProgram : r.mode; if (r.online === false || typeof r[m] !== 'number' || typeof r.avg !== 'number') return false; return r.avg < r[m] - 0.3 && ((r.power || 0) > 0 || r.avg < r[m] - 1.0); };
        async function loadMillPower() {
            if (DEMO || Date.now() - millPowAt < 300e3) return;
            millPowAt = Date.now();
            try {
                const res = await callApi('POST', 'services/shell_command/mill_rooms?return_response', {});   // the cached one: Mill is asked at most every 10 minutes
                const out = JSON.parse(res?.service_response?.stdout || '{}');
                if (out.rooms?.length) millPow = new Map(out.rooms.map(r => [String(r.name || '').toLowerCase(), { w: r.power || 0, at: Date.parse(r.received || '') || 0, on: radOn(r) }]));
            } catch (e) { /* keep the old numbers */ }
        }
        const millL1Kw = t => L1_ROOMS.reduce((sum, n) => { const r = millPow.get(n); return sum + (r && r.on && r.at <= t + 10e3 ? (r.w > 0 ? r.w : RAD_W) / 1000 : 0); }, 0);
        const BASE_L1_A = 0.4, BASE_L2_A = 0.4, WATER_A = 6.5;   // the water heater: ~6.5 A on L3 (1.46 kW at 232 V, runs ~8 minutes), measured 2026-11-20   // L1 current with the heat pump, water heater and radiators off (2026-11-20)
        const HOURS = { 0.17: { bucket: 10e3 }, 1: { bucket: 10e3 }, 6: { bucket: 60e3 }, 24: { bucket: 300e3 } };   // 0.17 h = the last 10 minutes at the Pulse's own 10 s
        let hours = 1;
        try { const h = +localStorage.getItem('sfc_h'); if (HOURS[h]) hours = h; } catch (e) {}
        let chart = null, reg = [], regAt = 0, ids = null, prices = null, pricesAt = 0;
        const openDialog = () => openPopup('/local/stugan-strom.html?v=' + Date.now());
        document.getElementById('gear').addEventListener('click', e => { e.stopPropagation(); openPopup('/local/stugan-data.html?v=' + Date.now()); });
        for (const id of ['nowButton', 'mix', 'chartBox']) document.getElementById(id).addEventListener('click', openDialog);

        // The heat pump's Mill socket is its own group ("Varmepumpe"); "El-varme" is every other Mill device.
        async function vpUnique() {
            if (!reg.length || Date.now() - regAt > 5 * 60e3) { reg = (await callWS({ type: 'config/entity_registry/list' })) || reg; regAt = Date.now(); }
            return reg.find(r => r.platform === 'mill' && r.entity_id.startsWith('climate.') && /varmepump/i.test(r.entity_id))?.unique_id || null;
        }
        async function statIds() {
            if (ids) return ids;
            const list = (await callWS({ type: 'recorder/list_statistic_ids' })) || [];
            const vpU = await vpUnique(), vpStat = vpU ? 'mill:energy_' + vpU.replace(/-/g, '_') : null;
            const cons = list.find(s => s.statistic_id.startsWith('tibber:energy_consumption_'));
            return (ids = {
                vp: list.some(x => x.statistic_id === 'sensor.varmepumpe_day_consumption') ? ['sensor.varmepumpe_day_consumption'] : [],   // the Mill socket's kWh since midnight (the 'mill:energy_' statistic is all zeros for it)
                vpDay: 'sensor.varmepumpe_day_consumption',
                millDay: reg.filter(r => r.platform === 'mill' && /_day_consumption$/.test(r.entity_id) && !/varmepump/.test(r.entity_id)).map(r => r.entity_id),
                cons: cons?.statistic_id, cost: cons?.statistic_id.replace('energy_consumption_', 'energy_totalcost_'),
                ev: list.filter(s => s.statistic_id === 'sensor.stugan_energy_meter').map(s => s.statistic_id),
                mill: reg.filter(r => r.platform === 'mill' && /_day_consumption$/.test(r.entity_id) && !/varmepump/.test(r.entity_id) && list.some(x => x.statistic_id === r.entity_id)).map(r => r.entity_id),
                sensibo: list.filter(s => /sensibo|thomas_s_device/.test(s.statistic_id) && s.has_sum && /kWh/.test(s.statistics_unit_of_measurement || s.unit_of_measurement || '')).map(s => s.statistic_id),
            });
        }

        // Which sensors: the Pulse's power, the charger's power, the Mill heaters' power.
        async function sensors() {
            if (DEMO) return { states: new Map(), pulse: 'demo', ev: 'demo-ev', mill: ['demo-m1'] };
            const states = new Map((await callApi('GET', 'states')).map(s => [s.entity_id, s]));
            if (!reg.length || Date.now() - regAt > 5 * 60e3) { reg = (await callWS({ type: 'config/entity_registry/list' })) || reg; regAt = Date.now(); }
            const tib = reg.filter(r => r.platform === 'tibber' && !r.disabled_by);
            // Tibber Pulse: the integration puts its real-time sensors under their own device ("Tibber Pulse <home>"), unique id <home>_rt_power
            const rtPower = tib.find(r => /_rt_power$/.test(r.unique_id || '')) || tib.find(r => states.get(r.entity_id)?.attributes.device_class === 'power' && /power/i.test(r.entity_id) && !/average|production|min_|max_|factor/i.test(r.entity_id));
            const pulse = rtPower && states.get(rtPower.entity_id);
            const vpU = await vpUnique();
            const millPower = reg.filter(r => r.platform === 'mill' && !r.disabled_by && r.entity_id.startsWith('sensor.') && states.get(r.entity_id)?.attributes.device_class === 'power');
            const isVp = r => vpU && (r.unique_id || '').startsWith(vpU);
            const mill = millPower.filter(r => !isVp(r)).map(r => r.entity_id), vp = millPower.filter(isVp).map(r => r.entity_id);
            // L1 current (A) and voltage: the heat pump hangs on L1 (measured 2026-11-20, docs/stugan-faser.md), and the Mill socket on it is ~10 minutes old
            const l1 = tib.find(r => /_rt_currentL1$/.test(r.unique_id || ''))?.entity_id, v1 = tib.find(r => /_rt_voltagePhase1$/.test(r.unique_id || ''))?.entity_id;
            const l2 = tib.find(r => /_rt_currentL2$/.test(r.unique_id || ''))?.entity_id, l3 = tib.find(r => /_rt_currentL3$/.test(r.unique_id || ''))?.entity_id;
            const sens = reg.find(r => r.platform === 'sensibo' && r.entity_id.startsWith('climate.'))?.entity_id;   // the heat pump: on or off
            return { states, l1, v1, l2, l3, sens, pulse: pulse && isOk(pulse) ? pulse : null, pulseEntity: pulse, ev: states.get('sensor.stugan_charge_power') ? 'sensor.stugan_charge_power' : null, mill, vp };
        }

        const kw = (state, unit) => parseFloat(state) * (unit === 'kW' ? 1 : 1e-3);

        // Power histories from `since`, bucketed to a common timeline: [{t, total, mill, ev, rest}] in kW.
        // The long windows (today) are fetched at most every 5 minutes: every 15 s was 46 KB gzipped (more than the whole rest), and it grows during the day.
        const seriesCache = new Map();
        /* A radiator on L1 (the guest cottage's frost guard cycles ~15 min on, Mill reports 0 W) switches on in ONE step of 1.7-3.3 A and off in one equal step;
           the heat pump ramps over about a minute. So a fast rise that holds until an equal fall is a radiator. Measured 2026-11-20 19:48-20:04: +3.1 A, then -3.3 A. */
        function stepTracker(thr) {
            let steps = [], h = [];   // h: the last four readings; a jump counts only when the readings on both sides of it are flat
            return (a, t) => {
                steps = steps.filter(s => t - s.t < 45 * 60e3);
                if (a != null) {
                    h.push(a); if (h.length > 4) h.shift();
                    if (h.length === 4) {
                        const d = h[2] - h[1], flat = Math.abs(h[1] - h[0]) < 0.5 && Math.abs(h[3] - h[2]) < 0.5;
                        if (flat && d >= thr) steps.push({ t, a: d });
                        else if (flat && d <= -thr) {
                            let bi = -1, bd = 1.0;
                            steps.forEach((s, i) => { const diff = Math.abs(s.a + d); if (diff <= bd) { bd = diff; bi = i; } });
                            if (bi >= 0) steps.splice(bi, 1);
                        }
                    }
                }
                return steps.reduce((p, s) => p + s.a, 0);   // amps of radiators switched on in steps
            };
        }
        async function series(sn, since, bucket) {
            const long = Date.now() - since > 3 * 3600e3, key = `${bucket}|${Math.floor(since / 60e3)}`, hit = seriesCache.get(key);
            if (long && hit && Date.now() - hit.at < 300e3) return hit.v;
            const v = await seriesRaw(sn, since, bucket);
            if (long) seriesCache.set(key, { at: Date.now(), v });
            return v;
        }
        async function seriesRaw(sn, since, bucket) {
            await loadMillPower();
            if (DEMO) {
                const n = Math.round((Date.now() - since) / bucket), out = [];
                for (let i = 0; i < n; i++) { const t = since + i * bucket, total = 1.1 + 0.5 * Math.sin(i / 14) + (i % 40 < 6 ? 1.8 : 0), mill = Math.max(0, 0.7 * Math.sin(i / 25) + 0.6), ev = i % 90 < 20 ? 2.3 : 0; out.push({ t, total: total + mill + ev, mill, ev, rest: total }); }
                return out;
            }
            const all = [sn.pulseEntity.entity_id, ...(sn.ev ? [sn.ev] : []), ...sn.mill, ...sn.vp, ...(sn.l1 && sn.v1 ? [sn.l1, sn.v1] : []), ...(sn.l2 ? [sn.l2] : []), ...(sn.l3 ? [sn.l3] : []), ...(sn.sens ? [sn.sens] : [])];
            const res = await callApi('GET', `history/period/${new Date(since).toISOString()}?filter_entity_id=${all.join(',')}&end_time=${encodeURIComponent(new Date().toISOString())}&minimal_response&no_attributes`);
            const by = new Map((res || []).map(rows => [rows[0]?.entity_id, rows]));
            const unit = id => sn.states.get(id)?.attributes.unit_of_measurement;
            // One timeline of equal steps. The Pulse reports every ~10 s, so a step of 10 s is its own resolution. A slow sensor (the Mill
            // stikket every ~11 min, the charger) keeps its last value until the next reading: its history only has a row when it changes.
            const points = (id, raw) => (by.get(id) || []).map(r => ({ t: new Date(r.last_updated || r.last_changed).getTime(), v: raw ? parseFloat(r.state) : kw(r.state, unit(id)) }))
                .filter(p => !Number.isNaN(p.v)).sort((x, y) => x.t - y.t);
            const track = (id, raw) => { const pts = points(id, raw); let i = 0, last = null; return t0 => {
                let sum = 0, n = 0;
                while (i < pts.length && pts[i].t < t0 + bucket) { if (pts[i].t >= t0) { sum += pts[i].v; n++; } last = pts[i].v; i++; }
                return n ? sum / n : last;   // average of the readings in the step, else the last known value (null before the first)
            }; };
            const tTot = track(sn.pulseEntity.entity_id), tEv = sn.ev ? track(sn.ev) : () => 0, tMill = sn.mill.map(id => track(id)), tVp = sn.vp.map(id => track(id));
            // Heat pump = what L1 draws above the house's own L1 baseline (0.4 A measured with everything off), minus the guest cottage's radiator,
            // which hangs on L1 as well. Falls back to the Mill socket when the Pulse has no phase readings.
            const useL1 = !!(sn.l1 && sn.v1), tL1 = useL1 ? track(sn.l1, true) : null, tV1 = useL1 ? track(sn.v1, true) : null;
            const gaestIdx = sn.mill.findIndex(id => /gaest|g[äa]st/i.test(id));
            // El-varme is found from the phases too, since Home Assistant's Mill sensors are not polled (measured 2026-11-20 with all radiators on:
            // each radiator is ~0.65 kW; two on L1, the Stuen radiator alone on L2, one on L3). L2 above its baseline = El-varme; L1 above its
            // baseline = El-varme while the heat pump is OFF (Sensibo); a 1.5-4 A load on L3 while the charger is idle = a radiator (the water
            // heater is 6 A, the fridge 0.5 A). With the heat pump on, radiators on L1 cannot be told from it and count as Varmepumpe.
            const tL2 = sn.l2 ? track(sn.l2, true) : () => null, tL3 = sn.l3 ? track(sn.l3, true) : () => null;
            const sensRows = (by.get(sn.sens) || []).map(r => ({ t: new Date(r.last_updated || r.last_changed).getTime(), v: r.state })).sort((x, y) => x.t - y.t);
            let si = 0, sLast = null;
            const tSens = t0 => { while (si < sensRows.length && sensRows[si].t < t0 + bucket) { sLast = sensRows[si].v; si++; } return sLast; };
            const stepA = stepTracker(1.5), out = [];
            for (let t = Math.floor(since / bucket) * bucket; t < Date.now(); t += bucket) {
                const total = tTot(t), e = tEv(t) || 0, mm = tMill.map(fn => fn(t) || 0);
                const a1 = useL1 ? tL1(t) : null, volt = useL1 ? tV1(t) : null;
                // amps of the heat pump = L1 above the baseline, minus the guest cottage's radiator (resistive, pf 1) on the same phase
                const stepAmps = useL1 ? stepA(a1, t) : 0, l1Rad = useL1 ? Math.max(millL1Kw(t), stepAmps * (volt || 230) / 1000) : 0;
                const dA = useL1 ? Math.max(0, (a1 == null ? 0 : a1) - BASE_L1_A - l1Rad * 1000 / (volt || 230)) : 0;
                const sensOff = useL1 && tSens(t) === 'off', V = volt || 230, a2 = useL1 ? tL2(t) : null, a3 = useL1 ? tL3(t) : null;
                const vv = useL1 ? [sensOff ? 0 : dA * V * hpPf(dA) / 1000] : tVp.map(fn => fn(t) || 0);
                const excess = (a, base) => Math.max(0, (a == null ? 0 : a) - base) * V / 1000;
                // L3 (the charger, the water heater, a radiator, the fridge): amps above the baseline. Zaptec reports the charger up to ~2 minutes late,
                // so a big L3 with nothing from Zaptec yet is the charger; otherwise its amps are taken off. A load of ~6.5 A is the water heater, and
                // what is left of 1.5-4 A is a radiator (the fridge is 0.5 A and stays in "Resten").
                let eKw = e, x = a3 == null ? 0 : Math.max(0, a3 - 0.2);
                if (useL1 && a3 != null) { if (e < 0.1 && x >= 11) { eKw = x * V / 1000; x = 0; } else x = Math.max(0, x - e * 1000 / V); }
                const waterOn = useL1 && x >= 4.5, wKw = waterOn ? WATER_A * V / 1000 : 0;
                if (waterOn) x = Math.max(0, x - WATER_A);
                const radKw = useL1 ? excess(a2, BASE_L2_A) + (sensOff ? excess(a1, BASE_L1_A) : Math.min(l1Rad, excess(a1, BASE_L1_A))) + (x >= 1.5 && x <= 4 ? x * V / 1000 : 0) : null;
                if (total == null) continue;
                const keep = Math.min(total, 0.18), m = Math.min(radKw != null ? radKw : mm.reduce((p, q) => p + q, 0), total - keep), v = Math.min(vv.reduce((p, q) => p + q, 0), Math.max(0, total - keep - m));   // the house's own ~0.18 kW (fridge, router, standby, measured 2026-11-20) stays in Resten, so a radiator switching on never turns the whole curve orange
                const ev = Math.min(eKw, Math.max(0, total - m - v)), w = Math.min(wKw, Math.max(0, total - m - v - ev));
                out.push({ t, total, mill: m, vp: v, vv: w, ev, rest: Math.max(0, total - m - v - ev - w) });
            }
            return out;
        }

        const gradient = col => c => { const a = c.chart.chartArea; if (!a) return col + '33'; const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '22'); return g; };
        const clock = t => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });

        function drawAreas(pts, since) {
            if (chart) chart.destroy();
            const set = (key, label, i) => ({ label, data: pts.map(p => ({ x: p.t, y: p[key] })), borderColor: COLORS[key], borderWidth: 1.6, pointRadius: 0, tension: 0.2, fill: i === 0 ? 'origin' : '-1', backgroundColor: COLORS[key] + 'cc' });   // each group fills only its own band, in the legend's colour (a fill to the axis let the orange shine through the purple)
            chart = new Chart(document.getElementById('chart'), {
                type: 'line',
                data: { datasets: [set('rest', NAMES.rest, 0), set('ev', NAMES.ev, 1), set('vv', NAMES.vv, 2), set('vp', NAMES.vp, 3), set('mill', NAMES.mill, 4)] },   // Resten at the bottom, the heat pump above it, El-varme (orange) on top
                options: { responsive: true, maintainAspectRatio: false, animation: false, parsing: false, interaction: { mode: 'index', intersect: false },
                    scales: { x: { type: 'linear', min: since, max: Date.now(), grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 11 }, maxRotation: 0, maxTicksLimit: 5, callback: v => clock(v) } },
                              y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 11 }, maxTicksLimit: 4, callback: v => `${f(v, v % 1 ? 1 : 0)} kW` } } },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => clock(i[0].parsed.x), label: i => `${i.dataset.label}: ${f(i.parsed.y, 2)} kW` } } } },
            });
            chart.options.scales.y.stacked = true; chart.update();
        }

        // Hourly statistics from the meter (Tibber), the last 2 days, split into the groups.
        async function meterHours() {
            let rows;
            if (DEMO) rows = Array.from({ length: 48 }, (_, i) => ({ t: Date.now() - (48 - i) * 3600e3, total: 0.5 + 0.4 * Math.abs(Math.sin(i / 3)), cost: 1.2, mill: 0.1, ev: i % 20 < 3 ? 2 : 0, sensibo: 0 }));
            else {
                const s = await statIds(); if (!s.cons) return { rows: [], src: s };
                const res = await callWS({ type: 'recorder/statistics_during_period', start_time: new Date(Date.now() - 4 * 864e5).toISOString(), end_time: new Date().toISOString(), statistic_ids: [s.cons, s.cost, ...s.ev, ...s.mill, ...s.sensibo, ...s.vp], period: 'hour', types: ['change'] });
                const at = new Map(), row = t => { if (!at.has(t)) at.set(t, { t, total: 0, cost: 0, mill: 0, vp: 0, ev: 0, sensibo: 0 }); return at.get(t); };
                const add = (id, key) => ((res && res[id]) || []).forEach(r => { if (r.change != null) row(new Date(r.start).getTime())[key] += r.change; });
                add(s.cons, 'total'); add(s.cost, 'cost'); s.ev.forEach(i => add(i, 'ev')); s.mill.forEach(i => add(i, 'mill')); s.sensibo.forEach(i => add(i, 'sensibo')); s.vp.forEach(i => add(i, 'vp'));
                rows = [...at.values()].filter(r => r.total > 0).sort((a, b) => a.t - b.t);
                for (const r of rows) r.rest = Math.max(0, r.total - r.mill - r.ev - r.sensibo - r.vp);
                return { rows: rows.slice(-48), src: s };
            }
            for (const r of rows) r.rest = Math.max(0, r.total - r.mill - r.ev - r.sensibo - r.vp);
            return { rows, src: {} };
        }

        function drawMeter(rows) {
            if (chart) chart.destroy();
            const keys = ['mill', 'vp', 'ev', 'rest'];
            chart = new Chart(document.getElementById('chart'), {
                type: 'bar',
                data: { labels: rows.map(r => r.t), datasets: keys.map(k => ({ label: NAMES[k], data: rows.map(r => r[k]), backgroundColor: COLORS[k], borderRadius: 2, maxBarThickness: 12 })) },
                options: { responsive: true, maintainAspectRatio: false, animation: false,
                    scales: { x: { stacked: true, grid: { display: false }, ticks: { color: '#8da0ad', font: { size: 11 }, maxRotation: 0, maxTicksLimit: 5, callback(v) { const t = rows[v]?.t; return t ? new Date(t).toLocaleString('da-DK', { weekday: 'short', hour: '2-digit' }) : ''; } } },
                              y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 11 }, callback: v => f(v, 1) } } },
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, callbacks: { title: i => new Date(rows[i[0].dataIndex].t).toLocaleString('da-DK', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), label: i => `${i.dataset.label}: ${f(i.parsed.y, 2)} kWh` } } } },
            });
        }

        // The box underneath: a label, the kWh and kr, the split as a bar and a legend.
        function mix(label, parts, total, cost, keys) {
            document.getElementById('mixLabel').textContent = label;
            document.getElementById('mixTotal').textContent = total > 0 ? `${f(total, 1)} kWh` : '–';
            document.getElementById('mixCost').textContent = cost > 0 ? `· ${f(cost, 0)} kr` : '';
            document.getElementById('bar').innerHTML = keys.map(k => `<i style="width:${total > 0 ? Math.max(0, parts[k] / total * 100) : 0}%;background:${COLORS[k]}"></i>`).join('');
            document.getElementById('legend').style.gridTemplateColumns = keys.length > 4 ? 'repeat(3, 1fr)' : keys.length > 3 ? 'repeat(2, 1fr)' : '';
            document.getElementById('legend').innerHTML = keys.map(k => `<span><span><i style="background:${COLORS[k]}"></i>${NAMES[k]}</span><b>${f(parts[k], 1)} kWh</b></span>`).join('');
        }

        async function todayCost(sn, ptsToday) {
            // today's kWh x the Tibber price at the time of each bucket
            if (DEMO) return ptsToday.reduce((a, p) => a + p.kwh * 1.4, 0);
            if (!prices || Date.now() - pricesAt > 10 * 60e3) {
                const d0 = new Date(); d0.setHours(0, 0, 0, 0);
                const res = await callApi('POST', 'services/tibber/get_prices?return_response', { start: d0.toISOString(), end: new Date(+d0 + 864e5).toISOString() });
                const home = Object.values(res.service_response?.prices || res.service_response || {})[0] || [];
                prices = home.map(r => ({ t: new Date(r.start_time).getTime(), price: r.price })); pricesAt = Date.now();
            }
            // Tibber's price plus 0.90 SEK/kWh for tax and transfer (the same 90 öre as on the price card)
            const at = t => { let best = prices[0]; for (const p of prices) if (p.t <= t) best = p; return best ? best.price + 0.9 : 0; };
            return ptsToday.reduce((a, p) => a + p.kwh * at(p.t), 0);
        }

        async function load() {
            const sn = await sensors();
            const live = !!sn.pulse;
            const pill = document.getElementById('pill');
            document.getElementById('range').style.visibility = live ? 'visible' : 'hidden';
            if (live) {
                const w = DEMO ? 2.14 : kw(sn.pulse.state, sn.pulse.attributes.unit_of_measurement);
                document.getElementById('power').textContent = String(Math.round(w * 1000 / 10) * 10); document.getElementById('unit').textContent = ' W';   // watt, to the nearest 10 (320 W, 4310 W) document.getElementById('note').textContent = '';
                pill.textContent = 'Live'; pill.className = 'pill good';
                const since = Date.now() - hours * 3600e3;
                const chartPts = await series(sn, since, HOURS[hours].bucket);
                // today, in kWh per group
                const d0 = new Date(); d0.setHours(0, 0, 0, 0);
                const day = await series(sn, +d0, 300e3), parts = { mill: 0, vp: 0, vv: 0, ev: 0, rest: 0 }, ptsToday = [];
                for (const p of day) { const h = 300e3 / 3600e3; parts.mill += p.mill * h; parts.vp += p.vp * h; parts.vv += p.vv * h; parts.ev += p.ev * h; parts.rest += p.rest * h; ptsToday.push({ t: p.t, kwh: p.total * h }); }
                // The heat pump's Mill socket counts today's kWh; the Pulse estimate only fills in when the socket has nothing. The difference comes off "Resten", so the total stays.
                const sid = await statIds(), kwhOf = id => { const v = parseFloat(sn.states.get(id)?.state); return Number.isNaN(v) ? 0 : v; };
                const vpMill = sid.vpDay ? kwhOf(sid.vpDay) : 0, elMill = (sid.millDay || []).reduce((a, id) => a + kwhOf(id), 0);   // the Mill counters: the heat pump's socket and every room's panel
                // The graph follows the Mill counters too: the Pulse only gives each group's shape over time, so each group is scaled to what Mill counted today
                // (the heat pump's socket, the rooms' panels); what that frees up or needs is taken from / given to "Resten", so the stack height stays the Pulse's total.
                const pulseVp = parts.vp, pulseMill = parts.mill;
                if (vpMill > 0) { parts.rest = Math.max(0, parts.rest - (vpMill - parts.vp)); parts.vp = vpMill; }
                if (elMill > 0) { parts.rest = Math.max(0, parts.rest - (elMill - parts.mill)); parts.mill = elMill; }
                const fVp = vpMill > 0 && pulseVp > 0.05 ? vpMill / pulseVp : 1, fMill = 1;   // El-varme in the graph is the Pulse's own measurement (a radiator = its measured ~0.65 kW); only the "I dag" kWh below uses the Mill counters
                for (const q of chartPts) { const dv = q.vp * (fVp - 1), avail = q.rest - dv, dm = q.mill * (fMill - 1), dmEff = dm > 0 ? Math.min(dm, Math.max(0, avail - 0.18)) : dm; q.vp += dv; q.mill += dmEff; q.rest = Math.max(0, avail - dmEff); }   // never eat into the house's own ~0.18 kW
                drawAreas(chartPts, since);
                const total = parts.mill + parts.vp + parts.vv + parts.ev + parts.rest;
                mix('I dag', parts, total, await todayCost(sn, ptsToday).catch(() => 0), ['mill', 'vp', 'vv', 'ev', 'rest']);
            } else {
                const { rows, src } = await meterHours();
                pill.textContent = sn.pulseEntity ? 'Pulse offline' : 'Måler'; pill.className = 'pill fair';
                if (!rows.length) { document.getElementById('power').textContent = '–'; document.getElementById('note').textContent = 'ingen data fra Tibber endnu'; mix('Seneste døgn', { mill: 0, vp: 0, ev: 0, rest: 0 }, 0, 0, ['mill', 'vp', 'ev', 'rest']); return; }
                drawMeter(rows);
                const day = rows.slice(-24), parts = { mill: 0, vp: 0, ev: 0, sensibo: 0, rest: 0 };
                let total = 0, cost = 0;
                for (const r of day) { for (const k of Object.keys(parts)) parts[k] += r[k]; total += r.total; cost += r.cost; }
                document.getElementById('power').textContent = f(total, 1); document.getElementById('unit').textContent = ' kWh';
                document.getElementById('note').textContent = `fra måleren, til ${new Date(rows[rows.length - 1].t).toLocaleString('da-DK', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}`;
                const keys = ['mill', ...(src.vp && src.vp.length ? ['vp'] : []), ...(DEMO ? [] : (src.sensibo && src.sensibo.length ? ['sensibo'] : [])), 'ev', 'rest'];
                mix('Seneste døgn', parts, total, cost, keys);
            }
        }

        const rangeBar = document.getElementById('range');
        const mark = () => rangeBar.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.h === hours));
        rangeBar.addEventListener('click', e => { e.stopPropagation(); const h = +e.target.dataset?.h; if (!h || h === hours) return; hours = h; try { localStorage.setItem('sfc_h', h); } catch (x) {} mark(); tick(); });
        mark();
        const tick = () => load().then(() => showError(null)).catch(showError);
        tick();
        setInterval(() => { if (!document.hidden) tick(); }, 15e3);   // nothing is fetched while the card is not seen
    </script>
</body>
</html>
