<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strømforbrug</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        .now { display: flex; align-items: baseline; gap: 6px; margin: 2px 0 0; }
        .now button { border: 0; background: none; color: inherit; font-family: inherit; cursor: pointer; padding: 0; }
        .now-value { font-size: 44px; font-weight: 300; line-height: 1.05; white-space: nowrap; }
        .now-value small { font-size: 16px; color: #8da0ad; }
        .now-note { font-size: 11px; color: #6d808c; line-height: 1.25; max-width: 110px; }
        .range { margin-left: auto; align-self: center; display: flex; gap: 4px; }
        .range button { padding: 3px 9px; border: 0; border-radius: 8px; background: rgba(255,255,255,.06); color: #8da0ad; font: inherit; font-size: 11px; cursor: pointer; }
        .range button.on { background: rgba(100,210,255,.2); color: #64d2ff; }

        .chart { flex: 1; min-height: 70px; position: relative; margin: 4px 0 6px; cursor: pointer; }
        .mix { margin-top: 6px; padding: 8px 12px 9px; border-radius: 12px; background: rgba(255,255,255,.06); cursor: pointer; }
        .mix-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: #8da0ad; text-transform: uppercase; letter-spacing: .6px; }
        .mix-head b { color: #f2f5f7; font-size: 17px; letter-spacing: 0; text-transform: none; font-weight: 600; }
        .mix-head small { font-size: 12px; font-weight: 400; color: #8da0ad; text-transform: none; letter-spacing: 0; }
        .bar { display: flex; height: 10px; margin: 7px 0 6px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.08); }
        .bar i { display: block; height: 100%; transition: width .4s; }
        .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 4px; font-size: 11px; color: #8da0ad; }
        .legend > span { display: flex; flex-direction: column; }
        .legend > span > span { display: flex; align-items: center; }
        .legend b { color: #f2f5f7; font-size: 13px; font-weight: 600; }
        .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="head"><span class="name">Strømforbrug</span><span class="pill" id="pill"></span></div>
        <div id="error" class="error" hidden></div>

        <div class="now">
            <button id="nowButton"><span class="now-value"><span id="power">–</span><small id="unit"> kW</small></span></button>
            <span class="now-note" id="note"></span>
            <div class="range" id="range"><button data-h="1" class="on">1 h</button><button data-h="6">6 h</button><button data-h="24">24 h</button></div>
        </div>
        <div class="chart" id="chartBox"><canvas id="chart"></canvas></div>

        <div class="mix" id="mix">
            <div class="mix-head"><span id="mixLabel">I dag</span><span><b id="mixTotal">–</b> <small id="mixCost"></small></span></div>
            <div class="bar" id="bar"></div>
            <div class="legend" id="legend"></div>
        </div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        /* Strømforbrug at the cottage, built like the card at home (hus.html).
           Live (Tibber Pulse online): the power now, and the last 1 h / 6 h / 24 h as stacked areas: Mill heaters, the EV charger and
           everything else (= the Pulse total minus those). "I dag" underneath is today's kWh and what it cost, split the same way.
           Pulse offline: the meter's own history through Tibber (hourly statistics, about a day late) takes its place, so the card
           shows the last 24 hours it has, split into the same groups. Pressing the card opens the dialog (stugan-strom.html).
           The sensors are found by themselves (entity registry, statistic ids). */
        const DEMO = new URLSearchParams(location.search).has('demo');
        const COLORS = { mill: '#ffb340', sensibo: '#34d1b8', ev: '#5fe085', rest: '#64d2ff' };
        const NAMES = { mill: 'Mill', sensibo: 'Sensibo', ev: 'Elbil', rest: 'Resten' };
        const f = (v, d) => v.toLocaleString('da-DK', { minimumFractionDigits: d, maximumFractionDigits: d });
        const isOk = s => s && !['unavailable', 'unknown'].includes(s.state);
        const HOURS = { 1: { bucket: 30e3 }, 6: { bucket: 120e3 }, 24: { bucket: 600e3 } };
        let hours = 1;
        try { const h = +localStorage.getItem('sfc_h'); if (HOURS[h]) hours = h; } catch (e) {}
        let chart = null, reg = [], regAt = 0, ids = null, prices = null, pricesAt = 0;
        const openDialog = () => openPopup('/local/stugan-strom.html?v=' + Date.now());
        for (const id of ['nowButton', 'mix', 'chartBox']) document.getElementById(id).addEventListener('click', openDialog);

        async function statIds() {
            if (ids) return ids;
            const list = (await callWS({ type: 'recorder/list_statistic_ids' })) || [];
            const cons = list.find(s => s.statistic_id.startsWith('tibber:energy_consumption_'));
            return (ids = {
                cons: cons?.statistic_id, cost: cons?.statistic_id.replace('energy_consumption_', 'energy_totalcost_'),
                ev: list.filter(s => s.statistic_id === 'sensor.stugan_energy_meter').map(s => s.statistic_id),
                mill: list.filter(s => s.source === 'mill' && s.statistic_id.startsWith('mill:energy_')).map(s => s.statistic_id),
                sensibo: list.filter(s => /sensibo|thomas_s_device/.test(s.statistic_id) && s.has_sum && /kWh/.test(s.statistics_unit_of_measurement || s.unit_of_measurement || '')).map(s => s.statistic_id),
            });
        }

        // Which sensors: the Pulse's power, the charger's power, the Mill heaters' power.
        async function sensors() {
            if (DEMO) return { states: new Map(), pulse: 'demo', ev: 'demo-ev', mill: ['demo-m1'] };
            const states = new Map((await callApi('GET', 'states')).map(s => [s.entity_id, s]));
            if (!reg.length || Date.now() - regAt > 5 * 60e3) { reg = (await callWS({ type: 'config/entity_registry/list' })) || reg; regAt = Date.now(); }
            const tib = reg.filter(r => r.platform === 'tibber' && !r.disabled_by);
            const price = tib.find(r => /\/kWh/.test(states.get(r.entity_id)?.attributes.unit_of_measurement || ''));
            const pulse = tib.filter(r => r.device_id === price?.device_id).map(r => states.get(r.entity_id)).find(s => s && s.attributes.device_class === 'power');
            const mill = reg.filter(r => r.platform === 'mill' && !r.disabled_by && r.entity_id.startsWith('sensor.') && states.get(r.entity_id)?.attributes.device_class === 'power').map(r => r.entity_id);
            return { states, pulse: pulse && isOk(pulse) ? pulse : null, pulseEntity: pulse, ev: states.get('sensor.stugan_charge_power') ? 'sensor.stugan_charge_power' : null, mill };
        }

        const kw = (state, unit) => parseFloat(state) * (unit === 'kW' ? 1 : 1e-3);

        // Power histories from `since`, bucketed to a common timeline: [{t, total, mill, ev, rest}] in kW.
        async function series(sn, since, bucket) {
            if (DEMO) {
                const n = Math.round((Date.now() - since) / bucket), out = [];
                for (let i = 0; i < n; i++) { const t = since + i * bucket, total = 1.1 + 0.5 * Math.sin(i / 14) + (i % 40 < 6 ? 1.8 : 0), mill = Math.max(0, 0.7 * Math.sin(i / 25) + 0.6), ev = i % 90 < 20 ? 2.3 : 0; out.push({ t, total: total + mill + ev, mill, ev, rest: total }); }
                return out;
            }
            const all = [sn.pulseEntity.entity_id, ...(sn.ev ? [sn.ev] : []), ...sn.mill];
            const res = await callApi('GET', `history/period/${new Date(since).toISOString()}?filter_entity_id=${all.join(',')}&end_time=${encodeURIComponent(new Date().toISOString())}&minimal_response&no_attributes`);
            const by = new Map((res || []).map(rows => [rows[0]?.entity_id, rows]));
            const unit = id => sn.states.get(id)?.attributes.unit_of_measurement;
            const bucketed = id => {
                const m = new Map();
                for (const r of by.get(id) || []) { const v = kw(r.state, unit(id)); if (Number.isNaN(v)) continue; const t = Math.floor(new Date(r.last_updated || r.last_changed).getTime() / bucket) * bucket; const a = m.get(t) || [0, 0]; a[0] += v; a[1]++; m.set(t, a); }
                return m;
            };
            const tot = bucketed(sn.pulseEntity.entity_id), ev = sn.ev ? bucketed(sn.ev) : new Map(), mills = sn.mill.map(bucketed);
            const avg = (m, t) => { const a = m.get(t); return a ? a[0] / a[1] : 0; };
            return [...tot.keys()].sort((a, b) => a - b).map(t => {
                const total = avg(tot, t), e = avg(ev, t), m = mills.reduce((s, mm) => s + avg(mm, t), 0);
                return { t, total, mill: Math.min(m, total), ev: Math.min(e, Math.max(0, total - m)), rest: Math.max(0, total - m - e) };
            });
        }

        const gradient = col => c => { const a = c.chart.chartArea; if (!a) return col + '33'; const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, col + 'aa'); g.addColorStop(1, col + '22'); return g; };
        const clock = t => new Date(t).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });

        function drawAreas(pts, since) {
            if (chart) chart.destroy();
            const set = (key, label) => ({ label, data: pts.map(p => ({ x: p.t, y: p[key] })), borderColor: COLORS[key], borderWidth: 1.6, pointRadius: 0, tension: 0.2, fill: true, backgroundColor: gradient(COLORS[key]) });
            chart = new Chart(document.getElementById('chart'), {
                type: 'line',
                data: { datasets: [set('rest', NAMES.rest), set('ev', NAMES.ev), set('mill', NAMES.mill)] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, parsing: false, interaction: { mode: 'index', intersect: false },
                    scales: { x: { type: 'linear', min: since, max: Date.now(), grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 11 }, maxRotation: 0, maxTicksLimit: 2, callback: v => clock(v) } },
                              y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 11 }, callback: v => `${f(v, 0)} kW` } } },
                    plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => clock(i[0].parsed.x), label: i => `${i.dataset.label}: ${f(i.parsed.y, 2)} kW` } } } },
            });
            chart.options.scales.y.stacked = true; chart.update();
        }

        // Hourly statistics from the meter (Tibber), the last 2 days, split into the groups.
        async function meterHours() {
            let rows;
            if (DEMO) rows = Array.from({ length: 48 }, (_, i) => ({ t: Date.now() - (48 - i) * 3600e3, total: 0.5 + 0.4 * Math.abs(Math.sin(i / 3)), cost: 1.2, mill: 0.1, ev: i % 20 < 3 ? 2 : 0, sensibo: 0 }));
            else {
                const s = await statIds(); if (!s.cons) return { rows: [], src: s };
                const res = await callWS({ type: 'recorder/statistics_during_period', start_time: new Date(Date.now() - 4 * 864e5).toISOString(), end_time: new Date().toISOString(), statistic_ids: [s.cons, s.cost, ...s.ev, ...s.mill, ...s.sensibo], period: 'hour', types: ['change'] });
                const at = new Map(), row = t => { if (!at.has(t)) at.set(t, { t, total: 0, cost: 0, mill: 0, ev: 0, sensibo: 0 }); return at.get(t); };
                const add = (id, key) => ((res && res[id]) || []).forEach(r => { if (r.change != null) row(new Date(r.start).getTime())[key] += r.change; });
                add(s.cons, 'total'); add(s.cost, 'cost'); s.ev.forEach(i => add(i, 'ev')); s.mill.forEach(i => add(i, 'mill')); s.sensibo.forEach(i => add(i, 'sensibo'));
                rows = [...at.values()].filter(r => r.total > 0).sort((a, b) => a.t - b.t);
                for (const r of rows) r.rest = Math.max(0, r.total - r.mill - r.ev - r.sensibo);
                return { rows: rows.slice(-48), src: s };
            }
            for (const r of rows) r.rest = Math.max(0, r.total - r.mill - r.ev - r.sensibo);
            return { rows, src: {} };
        }

        function drawMeter(rows) {
            if (chart) chart.destroy();
            const keys = ['mill', 'ev', 'rest'];
            chart = new Chart(document.getElementById('chart'), {
                type: 'bar',
                data: { labels: rows.map(r => r.t), datasets: keys.map(k => ({ label: NAMES[k], data: rows.map(r => r[k]), backgroundColor: COLORS[k], borderRadius: 2, maxBarThickness: 12 })) },
                options: { responsive: true, maintainAspectRatio: false, animation: false,
                    scales: { x: { stacked: true, grid: { display: false }, ticks: { color: '#8da0ad', font: { size: 11 }, maxRotation: 0, maxTicksLimit: 5, callback(v) { const t = rows[v]?.t; return t ? new Date(t).toLocaleString('da-DK', { weekday: 'short', hour: '2-digit' }) : ''; } } },
                              y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 11 }, callback: v => f(v, 1) } } },
                    plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false, callbacks: { title: i => new Date(rows[i[0].dataIndex].t).toLocaleString('da-DK', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), label: i => `${i.dataset.label}: ${f(i.parsed.y, 2)} kWh` } } } },
            });
        }

        // The box underneath: a label, the kWh and kr, the split as a bar and a legend.
        function mix(label, parts, total, cost, keys) {
            document.getElementById('mixLabel').textContent = label;
            document.getElementById('mixTotal').textContent = total > 0 ? `${f(total, 1)} kWh` : '–';
            document.getElementById('mixCost').textContent = cost > 0 ? `· ${f(cost, 0)} kr` : '';
            document.getElementById('bar').innerHTML = keys.map(k => `<i style="width:${total > 0 ? Math.max(0, parts[k] / total * 100) : 0}%;background:${COLORS[k]}"></i>`).join('');
            document.getElementById('legend').innerHTML = keys.map(k => `<span><span><i style="background:${COLORS[k]}"></i>${NAMES[k]}</span><b>${f(parts[k], 1)} kWh</b></span>`).join('');
        }

        async function todayCost(sn, ptsToday) {
            // today's kWh x the Tibber price at the time of each bucket
            if (DEMO) return ptsToday.reduce((a, p) => a + p.kwh * 1.4, 0);
            if (!prices || Date.now() - pricesAt > 10 * 60e3) {
                const d0 = new Date(); d0.setHours(0, 0, 0, 0);
                const res = await callApi('POST', 'services/tibber/get_prices?return_response', { start: d0.toISOString(), end: new Date(+d0 + 864e5).toISOString() });
                const home = Object.values(res.service_response?.prices || res.service_response || {})[0] || [];
                prices = home.map(r => ({ t: new Date(r.start_time).getTime(), price: r.price })); pricesAt = Date.now();
            }
            const at = t => { let best = prices[0]; for (const p of prices) if (p.t <= t) best = p; return best ? best.price : 0; };
            return ptsToday.reduce((a, p) => a + p.kwh * at(p.t), 0);
        }

        async function load() {
            const sn = await sensors();
            const live = !!sn.pulse;
            const pill = document.getElementById('pill');
            document.getElementById('range').style.visibility = live ? 'visible' : 'hidden';
            if (live) {
                const w = DEMO ? 2.14 : kw(sn.pulse.state, sn.pulse.attributes.unit_of_measurement);
                document.getElementById('power').textContent = f(w, 2); document.getElementById('unit').textContent = ' kW'; document.getElementById('note').textContent = '';
                pill.textContent = 'Live'; pill.className = 'pill good';
                const since = Date.now() - hours * 3600e3;
                drawAreas(await series(sn, since, HOURS[hours].bucket), since);
                // today, in kWh per group
                const d0 = new Date(); d0.setHours(0, 0, 0, 0);
                const day = await series(sn, +d0, 300e3), parts = { mill: 0, ev: 0, rest: 0 }, ptsToday = [];
                for (const p of day) { const h = 300e3 / 3600e3; parts.mill += p.mill * h; parts.ev += p.ev * h; parts.rest += p.rest * h; ptsToday.push({ t: p.t, kwh: p.total * h }); }
                const total = parts.mill + parts.ev + parts.rest;
                mix('I dag', parts, total, await todayCost(sn, ptsToday).catch(() => 0), ['mill', 'ev', 'rest']);
            } else {
                const { rows, src } = await meterHours();
                pill.textContent = sn.pulseEntity ? 'Pulse offline' : 'Måler'; pill.className = 'pill fair';
                if (!rows.length) { document.getElementById('power').textContent = '–'; document.getElementById('note').textContent = 'ingen data fra Tibber endnu'; mix('Seneste døgn', { mill: 0, ev: 0, rest: 0 }, 0, 0, ['mill', 'ev', 'rest']); return; }
                drawMeter(rows);
                const day = rows.slice(-24), parts = { mill: 0, ev: 0, sensibo: 0, rest: 0 };
                let total = 0, cost = 0;
                for (const r of day) { for (const k of Object.keys(parts)) parts[k] += r[k]; total += r.total; cost += r.cost; }
                document.getElementById('power').textContent = f(total, 1); document.getElementById('unit').textContent = ' kWh';
                document.getElementById('note').textContent = `fra måleren, til ${new Date(rows[rows.length - 1].t).toLocaleString('da-DK', { weekday: 'short', hour: '2-digit', minute: '2-digit' })}`;
                const keys = ['mill', ...(DEMO ? [] : (src.sensibo && src.sensibo.length ? ['sensibo'] : [])), 'ev', 'rest'];
                mix('Seneste døgn', parts, total, cost, keys);
            }
        }

        const rangeBar = document.getElementById('range');
        const mark = () => rangeBar.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.h === hours));
        rangeBar.addEventListener('click', e => { e.stopPropagation(); const h = +e.target.dataset?.h; if (!h || h === hours) return; hours = h; try { localStorage.setItem('sfc_h', h); } catch (x) {} mark(); tick(); });
        mark();
        const tick = () => load().then(() => showError(null)).catch(showError);
        tick();
        setInterval(tick, 15e3);
    </script>
</body>
</html>
