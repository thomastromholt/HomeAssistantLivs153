<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatur</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .rooms { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 6px; }

        .room {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 4px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .value {
            display: block;
            width: 100%;
            padding: 3px 0;
            border: 0;
            border-radius: 8px;
            background: none;
            color: inherit;
            font-family: inherit;
            cursor: pointer;
        }
        .value:hover, .value:focus-visible { background: rgba(255, 255, 255, 0.1); outline: none; }
        .room .tile-label { font-size: 12px; }
        .room-temp { margin-top: 6px; font-size: 38px; font-weight: 300; color: #64d2ff; }
        .room-temp small { font-size: 17px; color: #8da0ad; }
        .room-humidity { font-size: 19px; color: #8da0ad; }
        .room-humidity.good { color: #5fe085; }
        .room-humidity.fair { color: #ffb340; }
        .room-humidity.poor { color: #ff6b61; }
    </style>
</head>
<body>
    <div class="container">
        <div class="head"><span class="name">Temperatur</span></div>
        <div id="error" class="error" hidden></div>
        <div id="problems" class="problems" hidden></div>
        <div class="rooms" id="rooms"></div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        const ROOMS = [
            { name: 'Soveværelse', temp: 'sensor.ewelink_snzb_02p_temperatur', humidity: 'sensor.ewelink_snzb_02p_luftfugtighed' },
            { name: 'Toilet', temp: 'sensor.toilet_temperatur', humidity: 'sensor.toilet_luftfugtighed' },
            { name: 'Stue', temp: 'sensor.stue_stuen_temp_temperatur', humidity: 'sensor.stue_stuen_temp_luftfugtighed' },
            // Outdoors comes from the internet (met.no weather forecast), not from a sensor.
            { name: 'Ude', weather: 'weather.forecast_home' },
        ];

        // Airthings' own guide values for humidity.
        const humidityLevel = pct => pct >= 25 && pct <= 60 ? 'good' : pct >= 15 && pct <= 70 ? 'fair' : 'poor';

        function valueButton(className, entityId) {
            const button = document.createElement('button');
            button.className = `value ${className}`;
            button.addEventListener('click', () => openHistory(entityId));
            return button;
        }

        const cells = ROOMS.map(room => {
            const card = document.createElement('div');
            card.className = 'room';
            const label = document.createElement('div');
            label.className = 'tile-label';
            label.textContent = room.name;
            const temp = valueButton('room-temp', room.weather ?? room.temp);
            const humidity = valueButton('room-humidity', room.weather ?? room.humidity);
            card.append(label, temp, humidity);
            document.getElementById('rooms').append(card);
            return { temp, humidity };
        });

        async function render() {
            try {
                const sensors = ROOMS.filter(room => !room.weather);
                const states = await statesOf(sensors.flatMap(room => [room.temp, room.humidity]));
                const weather = Object.fromEntries(await Promise.all(ROOMS.filter(room => room.weather)
                    .map(async room => [room.name, (await callApi('GET', `states/${room.weather}`)).attributes])));
                const problems = [];
                ROOMS.forEach((room, i) => {
                    const temp = formatNumber(room.weather ? weather[room.name].temperature : states[room.temp], 1);
                    const humidity = formatNumber(room.weather ? weather[room.name].humidity : states[room.humidity], 0);
                    if (temp === null) problems.push(room.weather ? 'Outdoor weather unavailable' : `${room.name}: sensor offline`);
                    cells[i].temp.innerHTML = temp === null ? '–' : `${temp}<small> °C</small>`;
                    cells[i].humidity.textContent = humidity === null ? '–' : `💧 ${humidity} %`;
                    cells[i].humidity.classList.remove('good', 'fair', 'poor');
                    if (humidity !== null && !room.weather) cells[i].humidity.classList.add(humidityLevel(parseFloat(states[room.humidity])));
                });
                showProblems(problems);
                showError(null);
            } catch (error) {
                showError(error);
            }
        }

        render();
        setInterval(render, 30e3);
    </script>
</body>
</html>
