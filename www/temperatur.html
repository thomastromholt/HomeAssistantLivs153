<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatur</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .rooms { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }

        /* One line per room: name, temperature (with humidity where there is a thermometer), set temperature. */
        .zone { flex: 1; min-height: 0; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 14px; border: 1px solid rgba(100, 210, 255, 0.28); background: rgba(100, 210, 255, 0.05); }
        .zone-name { flex: none; width: 82px; font-size: 14px; font-weight: 600; }
        .cell { flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding: 3px 4px; border: 0; border-radius: 10px; background: rgba(255, 255, 255, 0.06); color: inherit; font-family: inherit; text-align: center; cursor: pointer; }
        .cell:hover, .cell:focus-visible { background: rgba(255, 255, 255, 0.1); outline: none; }
        .cell .tile-label { font-size: 10px; }
        .cell-value { font-size: 26px; font-weight: 300; line-height: 1.15; }
        .cell-value.temp { color: #64d2ff; }
        .cell-value small { font-size: 13px; color: #8da0ad; }
        .cell-sub { min-height: 13px; font-size: 11px; color: #8da0ad; line-height: 1.3; }
        .cell-sub .dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; vertical-align: 1px; border-radius: 50%; background: #5fe085; }
        .cell-sub .dot.busy { background: #ffb340; animation: pulse 1.2s infinite; }
        .cell-sub .dot.bad { background: #ff6b61; }
        @keyframes pulse { 50% { opacity: 0.3; } }
        .humidity.good { color: #5fe085; }
        .humidity.fair { color: #ffb340; }
        .humidity.poor { color: #ff6b61; }

        .outside { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.06); }
        .outside .value { width: auto; padding: 2px 6px; border: 0; border-radius: 8px; background: none; color: inherit; font-family: inherit; cursor: pointer; }
        .outside .value:hover { background: rgba(255, 255, 255, 0.1); }
        .out-temp { font-size: 22px; font-weight: 300; color: #64d2ff; }
        .out-temp small { font-size: 13px; color: #8da0ad; }
        .out-humidity { font-size: 15px; color: #8da0ad; }
    </style>
</head>
<body>
    <div class="container">
        <div class="head"><span class="name">Temperatur</span></div>
        <div id="error" class="error" hidden></div>
        <div id="problems" class="problems" hidden></div>

        <div class="rooms">
            <div id="zones" style="display: contents"></div>
            <div class="zone">
                <div class="zone-name">Gildestuen</div>
                <button class="cell" id="basementTemp">
                    <div class="tile-label">Thermometer</div>
                    <div class="cell-value temp" id="basementValue"></div>
                    <div class="cell-sub humidity" id="basementHumidity"></div>
                </button>
            </div>
            <div class="outside">
                <span class="tile-label">Ude</span>
                <button class="value out-temp" id="outTemp"></button>
                <button class="value out-humidity" id="outHumidity"></button>
            </div>
        </div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        const OUTDOOR = 'weather.forecast_home';   // from the internet (met.no), not a sensor

        // One LILJEBAGGE thermostat per room. A room with a `thermometer` shows that sensor (and humidity) instead of the
        // thermostat's own reading. `night: false` = no night-mode helpers (night mode is part of the room plans now).
        const ZONES = [
            // Timmerflotte moved to the basement (Gildestuen) on 2026-10-25, so Stue shows the thermostat's own reading until a new meter is in.
            { key: 'stue', name: 'Stue', suffix: '', deviceId: '88a5efd90680fa98c6117641c9084aec', night: false },
            { key: 'kokken', name: 'Køkken', suffix: '_2', deviceId: '693637959f507ce567f16408ba4b712d', night: false },
            { key: 'sovevaerelse', name: 'Soveværelse', suffix: '_3', deviceId: '6cc6d13bf6e043fa587d7ca0f61089d0', night: false },
            { key: 'astrid', name: 'Astrid', suffix: '_4', deviceId: 'd5c9bb2a681637513a7bde75b298a786', night: false,
              // The Airthings stands in this room for now and works as its thermometer.
              thermometer: { label: 'Thermometer', name: 'Airthings', temperature: 'sensor.airthings_wave_270668_temperatur',
                             humidity: 'sensor.airthings_wave_270668_luftfugtighed' } },
        ];

        // Airthings' own guide values for humidity.
        const humidityLevel = pct => pct >= 25 && pct <= 60 ? 'good' : pct >= 15 && pct <= 70 ? 'fair' : 'poor';
        const degrees = (value, digits = 1) => {
            const text = formatNumber(value, digits);
            return text === null ? '–' : `${text}<small> °C</small>`;
        };
        const percent = value => {
            const text = formatNumber(value, 0);
            return text === null ? '–' : `💧 ${text} %`;
        };

        for (const z of ZONES) {
            z.climate = `climate.liljebagge_radiator_thermostat${z.suffix}`;
            z.update = `update.liljebagge_radiator_thermostat_firmware${z.suffix}`;
            z.battery = `sensor.liljebagge_radiator_thermostat_batteri${z.suffix}`;
            z.nightActive = z.night === false ? null : `input_boolean.night_active_${z.key}`;
            z.dayTarget = z.night === false ? null : `input_number.day_target_${z.key}`;
            const zone = document.createElement('div');
            zone.className = 'zone';
            zone.innerHTML = `
                <div class="zone-name">${z.name}</div>
                <button class="cell" data-role="temp">
                    <div class="tile-label">${z.thermometer ? z.thermometer.label : 'Temperature'}</div>
                    <div class="cell-value temp" data-role="tempValue"></div>
                    <div class="cell-sub humidity" data-role="humidity"></div>
                </button>
                <button class="cell" data-role="valve">
                    <div class="tile-label">Set temp</div>
                    <div class="cell-value"><span data-role="target">–</span><small> °C</small></div>
                    <div class="cell-sub"><span class="dot" data-role="dot"></span><span data-role="title"></span> <span data-role="sub"></span></div>
                </button>`;
            z.el = role => zone.querySelector(`[data-role="${role}"]`);
            const popup = () => openPopup(`/local/liljebagge.html?room=${z.key}&v=` + Date.now());
            z.el('valve').addEventListener('click', popup);
            // The temperature opens the thermometer's history where there is one, otherwise the thermostat pop-up.
            z.el('temp').addEventListener('click', z.thermometer ? () => openHistory(z.thermometer.temperature) : popup);
            document.getElementById('zones').append(zone);
        }
        // The basement meter (Timmerflotte, moved from Stue on 2026-10-25). Its history is one entity: before and after the move.
        const BASEMENT = { temperature: 'sensor.timmerflotte_temp_hmd_sensor_temperatur', humidity: 'sensor.timmerflotte_temp_hmd_sensor_luftfugtighed' };
        document.getElementById('basementTemp').addEventListener('click', () => openHistory(BASEMENT.temperature));
        document.getElementById('outTemp').addEventListener('click', () => openHistory(OUTDOOR));
        document.getElementById('outHumidity').addEventListener('click', () => openHistory(OUTDOOR));

        async function renderZone(z, setback, problems) {
            const t = z.thermometer;
            if (t) {
                const temp = await stateOf(t.temperature).catch(() => null);
                const hum = await stateOf(t.humidity).catch(() => null);
                z.el('tempValue').innerHTML = degrees(temp);
                const humEl = z.el('humidity');
                humEl.textContent = percent(hum);
                humEl.classList.remove('good', 'fair', 'poor');
                if (!isMissing(hum)) humEl.classList.add(humidityLevel(parseFloat(hum)));
                if (isMissing(temp)) problems.push(`${z.name}: ${t.name} is offline`);
                if (t.battery) {
                    const level = parseFloat(await stateOf(t.battery).catch(() => null));
                    if (!Number.isNaN(level) && level < 15) problems.push(`${t.name} battery is low (${level} %)`);
                }
            }

            const climate = await callApi('GET', `states/${z.climate}`).catch(() => null);
            const update = await callApi('GET', `states/${z.update}`).catch(() => null);
            const battery = parseFloat(await stateOf(z.battery).catch(() => null));
            const night = z.nightActive
                ? { active: (await stateOf(z.nightActive)) === 'on', setback, dayTarget: formatNumber(await stateOf(z.dayTarget), 1) } : null;
            if (!climate || isMissing(climate.state)) {
                if (!t) z.el('tempValue').innerHTML = degrees(null);
                z.el('target').textContent = '–';
                z.el('title').textContent = 'Offline';
                z.el('dot').className = 'dot bad';
                z.el('dot').hidden = false;
                problems.push(`${z.name}: radiator thermostat is offline`);
            } else {
                if (!t) z.el('tempValue').innerHTML = degrees(climate.attributes.current_temperature);
                z.el('target').textContent = formatNumber(climate.attributes.temperature, 1) ?? '–';
                const status = await thermostatStatus({ climate, update, battery, deviceId: z.deviceId, night });
                // The thermostat claims heating while its valve reading is far above the target, and "lowest setting" is noise here.
                const hide = status.title === 'Reports heating' || status.title.startsWith('Heating') || status.title.startsWith('Lowest setting');
                z.el('dot').className = `dot ${status.level === 'good' ? '' : status.level}`;
                z.el('dot').hidden = hide;
                z.el('title').textContent = hide ? '' : status.title;
                z.el('sub').textContent = status.note || '';
                if (climate.state === 'off') problems.push(`${z.name}: radiator thermostat is switched off`);
            }
            if (!Number.isNaN(battery) && battery < 15) problems.push(`${z.name} thermostat battery is low (${battery} %)`);
        }

        async function render() {
            try {
                const problems = [];
                const setback = null;   // night mode is part of the room plans now (input_text.plan_<room>_...)
                for (const z of ZONES) await renderZone(z, setback, problems);

                // Gildestuen: the Timmerflotte in the basement (its own room, no thermostat).
                const basementTemp = await stateOf(BASEMENT.temperature).catch(() => null);
                const basementHum = await stateOf(BASEMENT.humidity).catch(() => null);
                document.getElementById('basementValue').innerHTML = degrees(basementTemp);
                const basementHumEl = document.getElementById('basementHumidity');
                basementHumEl.textContent = percent(basementHum);
                basementHumEl.classList.remove('good', 'fair', 'poor');
                if (!isMissing(basementHum)) basementHumEl.classList.add(humidityLevel(parseFloat(basementHum)));
                if (isMissing(basementTemp)) problems.push('Gildestuen: Timmerflotte is offline');

                const weather = await callApi('GET', `states/${OUTDOOR}`).catch(() => null);
                const out = weather && weather.attributes;
                document.getElementById('outTemp').innerHTML = degrees(out && out.temperature);
                document.getElementById('outHumidity').textContent = percent(out && out.humidity);
                if (!out || out.temperature === undefined) problems.push('Outdoor weather unavailable');

                showProblems(problems);
                showError(null);
            } catch (error) {
                showError(error);
            }
        }

        watchEntities([...ZONES.flatMap(z => [z.climate, z.update, z.nightActive, z.thermometer && z.thermometer.temperature].filter(Boolean)), BASEMENT.temperature], () => render());
        render();
        setInterval(render, 30e3);
    </script>
</body>
</html>
