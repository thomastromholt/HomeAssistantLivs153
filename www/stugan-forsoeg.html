<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forsøg</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        .container { gap: 8px; overflow-y: auto; }
        .goal { font-size: 12px; color: #a9b8c2; line-height: 1.45; }
        .goal b { color: #f2f5f7; }
        .ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #8da0ad; }
        .ctrl input { padding: 5px 8px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.08); color: inherit; font: inherit; width: 132px; }
        .ctrl input.n { width: 54px; }
        .ctrl button { padding: 5px 12px; border: 0; border-radius: 8px; background: rgba(100,210,255,0.16); color: #64d2ff; font: inherit; cursor: pointer; }
        .ctrl button.ghost { background: rgba(255,255,255,0.06); color: #8da0ad; }
        .check { padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.05); font-size: 11.5px; color: #a9b8c2; line-height: 1.55; }
        .check b { color: #f2f5f7; }
        .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .t { padding: 6px 9px; border-radius: 10px; background: rgba(255,255,255,0.06); min-width: 0; }
        .t .l { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; color: #8da0ad; white-space: nowrap; }
        .t .v { margin-top: 1px; font-size: 17px; font-weight: 300; white-space: nowrap; }
        .t .v small { font-size: 10px; color: #8da0ad; margin-left: 2px; }
        .t .v.good { color: #5fe085; } .t .v.bad { color: #ff6b61; }
        .chart { position: relative; flex: 1; min-height: 110px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { text-align: right; font-weight: 500; font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; color: #6d808c; padding: 0 3px 3px; }
        td { text-align: right; padding: 2px 3px; color: #c5d1d9; }
        th:first-child, td:first-child { text-align: left; }
        tr.skip td { color: #6d808c; }
        tr.visit td { color: #6d808c; text-decoration: line-through; }
        .foot { font-size: 10px; color: #6d808c; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="head"><span class="name">Forsøg <span class="muted">Mill alene</span></span><span class="pill" id="pill"></span></div>
        <div id="error" class="error" hidden></div>
        <div class="goal" id="goal"></div>
        <div class="ctrl"><label>Start <input type="date" id="start"></label><label>Dage <input type="number" id="len" class="n" min="3" max="21"></label><button id="go">Start i dag</button><button class="ghost" id="stop">Nulstil</button></div>
        <div id="body"></div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        /* The experiment: run the main house on Mill alone at 11 °C (the heat pump off) for about a week and see what it costs.
           The question is whether the heat pump at 16 °C really is cheaper below about 7 °C, and by how much. The expected numbers
           are the two lines from the energy signature (stugan-strom.html), measured 2026-11-14 on days without visitors:
             heat pump on 16 °C:   heating = 15.2 - 0.94 x outdoor °C   (kWh a day, over the base load)
             Mill / electric ~12:  heating = 22.1 - 1.88 x outdoor °C   (last winter's idle days, kept as the stand-in for Mill alone)
           The base load (fridge off since 2026-11-14, standby, the water heater) is taken off. The first days (the house cooling
           from 16 to 11 °C) use almost nothing and are left out of the averages. Start date and length are kept in this browser. */
        const DEMO_Q = new URLSearchParams(location.search);
        const HP = { a: 15.2, b: -0.94 }, MILL = { a: 22.1, b: -1.88 }, BASE = 2.0, COOL_DAYS = 2;
        const COTTAGE = { lat: 59.2, lon: 18.1 };   // roughly the cottage's area
        const VISIT_EV_KWH = 0.3;
        const visitDay = r => r.ev > VISIT_EV_KWH || (r.maxH > 1.5 && r.maxH > 2.2 * r.med + 0.8) || (r.maxH > 0.9 && r.maxH > 4 * r.med + 0.5 && r.T >= 3);
        const f = (v, d) => v.toLocaleString('da-DK', { minimumFractionDigits: d, maximumFractionDigits: d });
        const dayKey = d => new Date(d).toLocaleDateString('sv-SE');
        const heat = (l, T) => Math.max(l.a + l.b * T, 0);
        const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
        let start = DEMO_Q.get('start') || store.get('fs_start') || '', len = +(DEMO_Q.get('len') || store.get('fs_len') || 7);
        document.getElementById('start').value = start; document.getElementById('len').value = len;
        let chart = null, ids = null;

        async function statIds() {
            if (ids) return ids;
            const list = (await callWS({ type: 'recorder/list_statistic_ids' })) || [];
            const cons = list.find(s => s.statistic_id.startsWith('tibber:energy_consumption_'));
            return (ids = { cons: cons?.statistic_id, cost: cons?.statistic_id.replace('energy_consumption_', 'energy_totalcost_'), ev: list.filter(s => s.statistic_id === 'sensor.stugan_energy_meter').map(s => s.statistic_id) });
        }
        async function weather(from) {
            const t = new Map(), fill = j => (j.daily?.time || []).forEach((d, i) => { if (j.daily.temperature_2m_mean[i] != null) t.set(d, j.daily.temperature_2m_mean[i]); });
            const j = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${COTTAGE.lat}&longitude=${COTTAGE.lon}&daily=temperature_2m_mean&past_days=30&forecast_days=16&timezone=auto`)).json();
            fill(j); return t;
        }
        // the meter's days from `from` (YYYY-MM-DD) to now, with the car and the biggest hour for the visit rule; plus the price a kWh has cost lately
        async function meter(from) {
            const s = await statIds(); if (!s.cons) return { days: new Map(), price: 2.2 };
            const st = new Date(from + 'T00:00:00'), prior = new Date(Date.now() - 30 * 864e5);
            const day = await callWS({ type: 'recorder/statistics_during_period', start_time: (st < prior ? st : prior).toISOString(), end_time: new Date().toISOString(), statistic_ids: [s.cons, s.cost, ...s.ev], period: 'day', types: ['change'] });
            const hr = await callWS({ type: 'recorder/statistics_during_period', start_time: st.toISOString(), end_time: new Date().toISOString(), statistic_ids: [s.cons, ...s.ev], period: 'hour', types: ['change'] });
            const days = new Map(), O = k => days.get(k) || days.set(k, { total: 0, ev: 0, hours: [] }).get(k);
            ((day && day[s.cons]) || []).forEach(r => { if (r.change != null) O(dayKey(r.start)).total += r.change; });
            s.ev.forEach(id => ((day && day[id]) || []).forEach(r => { if (r.change != null) O(dayKey(r.start)).ev += r.change; }));
            const evH = new Map(); s.ev.forEach(id => ((hr && hr[id]) || []).forEach(r => evH.set(r.start, (evH.get(r.start) || 0) + (r.change || 0))));
            ((hr && hr[s.cons]) || []).forEach(r => { if (r.change != null) O(dayKey(r.start)).hours.push(r.change - (evH.get(r.start) || 0)); });
            let c = 0, k = 0; ((day && day[s.cons]) || []).forEach(r => { if (r.change > 0) k += r.change; }); ((day && day[s.cost]) || []).forEach(r => { if (r.change > 0) c += r.change; });
            return { days, price: k > 0 ? c / k : 2.2 };
        }

        function demoMeter(from) {
            const days = new Map(); const T = i => 3 + 2 * Math.sin(i / 2);
            for (let i = 0; i < 10; i++) { const d = dayKey(new Date(new Date(from + 'T12:00:00').getTime() + i * 864e5)); const ex = i < 2 ? 3 : heat(MILL, T(i)) * 0.95 + 2; days.set(d, { total: ex + BASE, ev: 0, hours: Array(24).fill(ex / 24) }); }
            return { days, price: 2.4 };
        }

        async function render() {
            const body = document.getElementById('body'), pill = document.getElementById('pill'), goal = document.getElementById('goal');
            const wx = await weather();
            const today = dayKey(new Date());
            goal.innerHTML = '<b>Kun Mill på 11 °C</b>, varmepumpen slukket: hvad koster det mod varmepumpen på 16 °C? De første to dage er afkøling.';
            if (!start) {
                // not started: what it would cost from tomorrow, by the forecast
                pill.textContent = 'Ikke startet'; pill.className = 'pill fair';
                const rows = Array.from({ length: len }, (_, i) => { const d = dayKey(new Date(Date.now() + (i + 1) * 864e5)); const T = wx.get(d); return { d, T, hp: T == null ? null : heat(HP, T), mill: T == null ? null : heat(MILL, T) }; }).filter(r => r.T != null);
                const dh = rows.reduce((a, r) => a + r.mill - r.hp, 0);
                const m = await meter(today).catch(() => ({ price: 2.2 }));
                body.innerHTML = `<div class="check"><b>Før I starter:</b> Mill skal være online og stå på 11 °C i husets rum. Slå varmepumpen fra. Ingen besøg i perioden. Hold øje med fugt (under 65 %) og temperaturen i rummene.</div>
                    <div class="tiles"><div class="t"><div class="l">Ude, snit</div><div class="v">${f(rows.reduce((a, r) => a + r.T, 0) / Math.max(1, rows.length), 1)}<small>°C</small></div></div>
                    <div class="t"><div class="l">Ekstra forbrug</div><div class="v ${dh > 0 ? 'bad' : 'good'}">${dh > 0 ? '+' : ''}${f(dh, 0)}<small>kWh</small></div></div>
                    <div class="t"><div class="l">Ekstra pris</div><div class="v ${dh > 0 ? 'bad' : 'good'}">${dh > 0 ? '+' : ''}${f(dh * m.price, 0)}<small>kr</small></div></div></div>
                    <table><tr><th>Dato</th><th>Ude °C</th><th>Varmepumpe</th><th>Mill</th></tr>${rows.map(r => `<tr><td>${new Date(r.d).toLocaleDateString('da-DK', { weekday: 'short', day: 'numeric', month: 'short' })}</td><td>${f(r.T, 1)}</td><td>${f(r.hp, 1)}</td><td>${f(r.mill, 1)}</td></tr>`).join('')}</table>
                    <div class="foot">Forventet opvarmning i kWh pr. dag (modellen fra energisignaturen). Vælg en startdato eller tryk "Start i dag", når I er online.</div>`;
                if (chart) { chart.destroy(); chart = null; }
                return;
            }
            const end = dayKey(new Date(new Date(start + 'T12:00:00').getTime() + (len - 1) * 864e5));
            const m = DEMO_Q.has('demo') ? demoMeter(start) : await meter(start);
            const list = [];
            for (let i = 0; i < len; i++) {
                const d = dayKey(new Date(new Date(start + 'T12:00:00').getTime() + i * 864e5));
                const o = m.days.get(d), T = wx.get(d);
                const v = o && o.hours.length >= 20 && T != null ? (() => { const hs = [...o.hours].sort((a, b) => a - b); const row = { ev: o.ev, maxH: hs[hs.length - 1], med: hs[Math.floor(hs.length / 2)], T }; return { net: o.total - o.ev - BASE, visit: visitDay(row) }; })() : null;
                list.push({ d, i, T, net: v ? v.net : null, visit: v ? v.visit : false, cool: i < COOL_DAYS, hp: T == null ? null : heat(HP, T), mill: T == null ? null : heat(MILL, T) });
            }
            const used = list.filter(r => r.net != null && !r.cool && !r.visit && r.T != null);
            const have = list.filter(r => r.net != null).length;
            const finished = today > end;
            pill.textContent = finished ? 'Færdig' : `Dag ${Math.min(len, list.filter(r => r.d <= today).length)} af ${len}`; pill.className = 'pill ' + (finished ? 'good' : 'fair');
            const mean = (a, k) => a.reduce((s, r) => s + r[k], 0) / a.length;
            let tiles = '';
            if (used.length >= 2) {
                const meas = mean(used, 'net'), hp = mean(used, 'hp'), mi = mean(used, 'mill');
                const ex = (meas - hp);
                tiles = `<div class="tiles"><div class="t"><div class="l">Målt</div><div class="v">${f(meas, 1)}<small>kWh/dag</small></div></div>
                    <div class="t"><div class="l">Varmepumpe</div><div class="v">${f(hp, 1)}<small>kWh/dag</small></div></div>
                    <div class="t"><div class="l">Forskel</div><div class="v ${ex > 0 ? 'bad' : 'good'}">${ex > 0 ? '+' : ''}${f(ex, 1)}<small>kWh/dag</small></div></div></div>
                    <div class="goal">Mill alene bruger <b>${f(Math.abs(meas / hp - 1) * 100, 0)} % ${meas > hp ? 'mere' : 'mindre'}</b> end varmepumpen på 16 °C ved samme vejr (${used.length} dage; modellen for Mill sagde ${f(mi, 1)} kWh/dag, målt ${f(meas, 1)}). ${f(Math.abs(ex) * m.price, 0)} kr ${ex > 0 ? 'ekstra' : 'sparet'} pr. dag.</div>`;
            } else tiles = `<div class="check">Samler data (${have} dag${have === 1 ? '' : 'e'} fra måleren; den kommer cirka et døgn forsinket). De første ${COOL_DAYS} dage er afkøling, og besøgsdage tælles ikke med.</div>`;
            body.innerHTML = `${tiles}<div class="chart"><canvas id="chart"></canvas></div>
                <table><tr><th>Dato</th><th>Ude</th><th>Målt</th><th>VP</th><th>Mill</th></tr>${list.map(r => `<tr class="${r.visit ? 'visit' : r.cool ? 'skip' : ''}"><td>${new Date(r.d).toLocaleDateString('da-DK', { weekday: 'short', day: 'numeric' })}${r.visit ? ' besøg' : r.cool ? ' afkøl.' : ''}</td><td>${r.T == null ? '–' : f(r.T, 1)}</td><td>${r.net == null ? '–' : f(r.net, 1)}</td><td>${r.hp == null ? '–' : f(r.hp, 1)}</td><td>${r.mill == null ? '–' : f(r.mill, 1)}</td></tr>`).join('')}</table>
                <div class="foot">kWh pr. dag over grundforbruget (${f(BASE, 1)}). VP = varmepumpe på 16 °C (modellen), Mill = modellen for elvarme. ${DEMO_Q.has('demo') ? 'DEMO-data. ' : ''}${start} → ${end}</div>`;
            if (chart) chart.destroy();
            chart = new Chart(document.getElementById('chart'), { data: { labels: list.map(r => new Date(r.d).toLocaleDateString('da-DK', { weekday: 'narrow', day: 'numeric' })), datasets: [
                { type: 'bar', label: 'Målt', data: list.map(r => r.net), backgroundColor: list.map(r => r.visit ? 'rgba(160,175,185,0.35)' : r.cool ? 'rgba(100,210,255,0.3)' : 'rgba(100,210,255,0.85)'), borderRadius: 3, maxBarThickness: 26, order: 2 },
                { type: 'line', label: 'Varmepumpe (model)', data: list.map(r => r.hp), borderColor: '#ffb340', borderWidth: 2, pointRadius: 2, tension: 0.2, order: 1 },
                { type: 'line', label: 'Mill (model)', data: list.map(r => r.mill), borderColor: '#5fe085', borderWidth: 2, borderDash: [5, 4], pointRadius: 2, tension: 0.2, order: 1 },
            ] }, options: { responsive: true, maintainAspectRatio: false, animation: false, scales: { x: { grid: { display: false }, ticks: { color: '#8da0ad', font: { size: 10 } } }, y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#8da0ad', font: { size: 10 } } } }, plugins: { legend: { labels: { color: '#a9b8c2', boxWidth: 10, font: { size: 10 } } } } } });
        }

        document.getElementById('start').addEventListener('change', e => { start = e.target.value; store.set('fs_start', start || null); render().catch(showError); });
        document.getElementById('len').addEventListener('change', e => { len = Math.min(21, Math.max(3, +e.target.value || 7)); e.target.value = len; store.set('fs_len', len); render().catch(showError); });
        document.getElementById('go').addEventListener('click', () => { start = dayKey(new Date()); document.getElementById('start').value = start; store.set('fs_start', start); render().catch(showError); });
        document.getElementById('stop').addEventListener('click', () => { start = ''; document.getElementById('start').value = ''; store.set('fs_start', null); render().catch(showError); });
        const tick = () => render().then(() => showError(null)).catch(showError);
        tick(); setInterval(tick, 5 * 60e3);
    </script>
</body>
</html>
