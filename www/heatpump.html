<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat pump</title>
    <link rel="stylesheet" href="/local/card-dark.css?v=1">
    <style>
        .tiles { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; gap: 6px; }
        .tiles .tile { display: flex; flex-direction: column; justify-content: center; }
        .tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
        .tile.idle { cursor: default; }
        /* Same type sizes as the Temperatur card: 12 px labels, 32 px light values with 17 px units. */
        .tiles .tile-label { font-size: 12px; }
        .tiles .tile-value { margin-top: 6px; font-size: 32px; font-weight: 300; line-height: 1.1; }
        .tiles .tile-value small { font-size: 17px; }


    </style>
</head>
<body>
    <div class="container" id="root">
        <div class="head">
            <span class="name">NIBE <span class="muted">EVP 270</span></span>
            <span class="pill" id="status"></span>
        </div>
        <div id="error" class="error" hidden></div>

        <div class="tiles" id="tiles"></div>

        <div class="footer" id="footer"></div>
    </div>

    <script src="/local/card-common.js?v=1"></script>
    <script>
        // These entities do not exist yet: they are what the card expects once the heat pump is connected
        // (HAN reader or clamp meter for power and energy, probe sensor for the supply pipe). Rename them here to match.
        const E = {
            supply: 'sensor.heatpump_supply_temperature',
            supplyTarget: 'sensor.heatpump_calculated_supply_temperature',
            power: 'sensor.heatpump_power',              // W
            energyToday: 'sensor.heatpump_energy_today', // kWh
            runtimeToday: 'sensor.heatpump_compressor_runtime_today', // hours
            startsToday: 'sensor.heatpump_compressor_starts_today',
            compressor: 'binary_sensor.heatpump_compressor',
        };
        const OUTDOOR = 'weather.forecast_home';


        function tile(label, entityId) {
            const button = document.createElement('button');
            button.className = 'tile';
            button.innerHTML = '<div class="tile-label"></div><div class="tile-value"></div>';
            button.querySelector('.tile-label').textContent = label;
            button.addEventListener('click', () => { if (button.dataset.live) openHistory(entityId); });
            document.getElementById('tiles').append(button);
            return button;
        }
        const supplyTile = tile('Supply temp', E.supply);
        supplyTile.addEventListener('click', () => openPopup('/local/heatpump-detail.html?v=' + Date.now()));
        const tiles = {
            supply: supplyTile,
            today: tile("Today's consumption", E.energyToday),
            compressor: tile('Outdoor unit', E.compressor),
        };

        function setTile(button, text, entityId, level) {
            const value = button.querySelector('.tile-value');
            value.innerHTML = text;
            value.className = `tile-value ${level ?? ''}`;
            button.dataset.live = text === '–' ? '' : '1';
            button.classList.toggle('idle', !button.dataset.live);
        }
        const withUnit = (state, digits, unit) => {
            const text = formatNumber(state, digits);
            return text === null ? '–' : `${text} <small>${unit}</small>`;
        };

        async function render() {
            try {
                const states = await statesOf(Object.values(E));
                const s = key => states[E[key]];

                // Supply temp is now a regular tile, no separate display needed

                const energy = parseFloat(s('energyToday'));
                const now = new Date(), midnight = new Date(now); midnight.setHours(0, 0, 0, 0);
                const hoursToday = (now - midnight) / 3600e3;
                const estimated = energy && hoursToday > 0 ? energy * 24 / hoursToday : null;
                const todayText = energy === null ? '–' : `${formatNumber(energy, 1)}<small> kWh</small><br><span style="font-size:10px;color:#6d808c">${estimated ? '~' + formatNumber(estimated, 0) + ' est.' : ''}</span>`;
                setTile(tiles.today, todayText, E.energyToday);

                const running = s('compressor') === 'on';
                setTile(tiles.compressor, s('compressor') === null ? '–' : running ? 'Running' : 'Idle', E.compressor, running ? 'good' : '');
                const runtime = parseFloat(s('runtimeToday'));
                const compressorMissing = states[E.compressor] === null;
                const status = document.getElementById('status');
                status.textContent = compressorMissing ? 'No data' : running ? 'Running' : 'Idle';
                status.className = `pill ${compressorMissing ? 'fair' : running ? 'good' : ''}`;
                showError(null);
            } catch (error) {
                showError(error);
            }
        }

        render();
        setInterval(render, 30e3);
    </script>
</body>
</html>
